  hintJp:'（　）に共通して入る言葉を［　］の中から選んで、必要なら形を変えて書きなさい。',
  qs:[
  M(1,'①a','新しいスカートなのに、泥が（　　）、汚れてしまった。','はねて',['はねる','はまって','振って'],
   'Váy mới mà bị bùn bắn lên nên bẩn mất rồi.',
   '<b>泥がはねる</b> = bùn bắn lên. Nối hai vế bằng thể て: はねて、汚れてしまった.'),
  M(2,'①b','髪が（　　）いるのに、彼女は気にしていないみたいだ。','はねて',['はねられて','はまって','振って'],
   'Tóc bị vểnh lên mà cô ấy có vẻ chẳng để ý.',
   '<b>髪がはねる</b> = tóc vểnh, bị cong ngược. はねている = đang trong trạng thái đó.'),
  M(3,'①c','車は通学途中の小学生三人を（　　）、そのまま逃げていった。','はねて',['はねられて','振って','はまって'],
   'Chiếc xe tông ba học sinh tiểu học đang trên đường đi học rồi bỏ chạy.',
   '<b>人をはねる</b> = tông (xe) vào người, hất văng. Chủ ngữ là 車 nên dùng chủ động. Nếu chủ ngữ là người bị tông thì dùng はねられる.'),
  M(4,'②a','トマトに塩を（　　）食べる。','振って',['振られて','振る','はねて'],
   'Rắc muối lên cà chua rồi ăn.',
   '<b>塩を振る</b> = rắc muối. 振る = rắc, vẩy. Nối bằng thể て với 食べる.'),
  M(5,'②b','いつまでも就職しないので、付き合っていた彼女に（　　）しまった。','振られて',['振って','はねられて','振る'],
   'Mãi không chịu đi làm nên tôi bị cô bạn gái đang hẹn hò đá mất.',
   '<b>人に振られる</b> = bị (người yêu) đá, bị từ chối (thể bị động của 振る).'),
  M(6,'②c','レポートに入れるグラフには番号を（　　）おきましょう。','振って',['振られて','振る','解いて'],
   'Hãy đánh số cho biểu đồ đưa vào báo cáo.',
   '<b>番号を振る</b> = đánh số, gán số. 振っておく = làm sẵn.'),
  M(7,'③a','母に着物の帯を（　　）もらった。','解いて',['解かれて','解き','振って'],
   'Tôi nhờ mẹ tháo dây đai (obi) của bộ kimono.',
   '<b>帯を解く</b> = tháo, cởi (dây đai). 〜てもらう = nhờ ai làm giúp.'),
  M(8,'③b','ある刑事が殺人事件のなぞを（　　）いくという内容の映画を見た。','解いて',['解かれて','解く','とらえて'],
   'Tôi đã xem một bộ phim nói về một thám tử dần dần giải mã bí ẩn của vụ án giết người.',
   '<b>なぞを解く</b> = giải bí ẩn. 〜ていく = làm dần dần.'),
  M(9,'③c','事実を明らかにして、みんなの誤解を（　　）たい。','解き',['解いて','解く','解かれ'],
   'Tôi muốn làm rõ sự thật và hóa giải hiểu lầm của mọi người.',
   '<b>誤解を解く</b> = gỡ bỏ hiểu lầm. 〜たい nối với dạng ます bỏ ます: 解きたい.'),
  M(10,'④a','動物園から逃げ出した猿を、係員が網で（　　）。','とらえた',['とらえて','はまった','振った'],
   'Nhân viên đã dùng lưới bắt con khỉ trốn khỏi sở thú.',
   '<b>とらえる</b> = bắt giữ (con vật, tội phạm). Câu kết thúc nên dùng とらえた.'),
  M(11,'④b','時代の変化を（　　）、その時代に合った新商品を開発する。','とらえて',['とらえた','とらえられて','はまって'],
   'Nắm bắt sự thay đổi của thời đại và phát triển sản phẩm mới hợp với thời đại đó.',
   '<b>変化をとらえる</b> = nắm bắt sự thay đổi. Nối hai vế dùng thể て (とらえ cũng được). とらえられて là bị động nên sai.'),
  M(12,'⑤a','この窓は先週割れてしまったので、今はガラスが（　　）いない。','はまって',['はまら','はめて','はねて'],
   'Cửa sổ này tuần trước bị vỡ nên giờ chưa lắp kính.',
   '<b>ガラスがはまる</b> = kính được lắp vào (tự động từ), phủ định はまっていない = chưa có kính. はめる là tha động từ (cần chủ thể).'),
  M(13,'⑤b','深みに（　　）ないように、川で遊ぶときは気を付けよう。','はまら',['はまって','はまり','はまる'],
   'Khi chơi ở sông hãy cẩn thận để không sa vào chỗ nước sâu.',
   '<b>深みにはまる</b> = sa vào chỗ sâu. 〜ないように nối với thể ない: はまらない.')
  ]},
 /* ---------- 問題2-(3) ---------- */
 {id:'b5s2c', jp:'問題2', name:'Từ chung (3)', type:'mc',
  hint:'Từ trong khung: 握る・ふさがる・ぶつかる・触れる. Mỗi nhóm ①②③④ dùng chung một từ — chọn đúng dạng.',
  hintJp:'（　）に共通して入る言葉を［　］の中から選んで、必要なら形を変えて書きなさい。',
  qs:[
  M(1,'①a','しょう油は、空気や光に（　　）と、味が変化してしまいます。','触れる',['触れて','ぶつかる','触れ'],
   'Nước tương nếu tiếp xúc với không khí và ánh sáng thì mùi vị sẽ thay đổi.',
   '<b>触れる</b> (ふれる) = chạm, tiếp xúc. 〜と (điều kiện) nối với dạng từ điển: 触れると.'),
  M(2,'①b','首相はスピーチで重要な課題の一つとして環境問題にも（　　）。','触れた',['触れて','触れ','握った'],
   'Trong bài phát biểu, thủ tướng cũng đề cập đến vấn đề môi trường như một trong những vấn đề quan trọng.',
   '<b>〜に触れる</b> = đề cập đến. Câu kết thúc, chuyện đã nói nên dùng 触れた.'),
  M(3,'②a','通勤時間に（　　）と電車が込むので、朝早く出かけよう。','ぶつかる',['ぶつかって','ふさがる','握る'],
   'Nếu trùng giờ đi làm thì tàu sẽ đông nên hãy đi sớm.',
   '<b>〜にぶつかる</b> = trùng với, rơi vào (thời điểm). 通勤時間にぶつかると = nếu trùng giờ đi làm.'),
  M(4,'②b','彼とは考え方が違うので、いつも意見が（　　）しまう。','ぶつかって',['ぶつかる','ふさがって','触れて'],
   'Vì cách nghĩ khác anh ấy nên ý kiến lúc nào cũng va chạm nhau.',
   '<b>意見がぶつかる</b> = ý kiến xung đột. Nối với しまう bằng thể て.'),
  M(5,'③a','手術をしたときの傷がまだ（　　）いないので、激しい運動はできない。','ふさがって',['ふさがら','ぶつかって','握って'],
   'Vết thương lúc phẫu thuật vẫn chưa liền miệng nên chưa vận động mạnh được.',
   '<b>傷がふさがる</b> = vết thương liền lại, khép miệng. ふさがっていない = chưa lành.'),
  M(6,'③b','ホテルを予約しようとしたが、部屋は全部（　　）いるということだった。','ふさがって',['ふさがら','ぶつかって','触れて'],
   'Tôi định đặt khách sạn nhưng nghe nói phòng đã kín hết.',
   '<b>部屋がふさがる</b> = phòng đã có người, kín chỗ.'),
  M(7,'④a','普段は電車を使っているので、車のハンドルを（　　）のは久しぶりだ。','握る',['握って','握ら','触れる'],
   'Bình thường tôi đi tàu nên lâu rồi mới cầm vô lăng ô tô.',
   '<b>ハンドルを握る</b> = cầm lái. のは + dạng từ điển: 握るのは久しぶりだ.'),
  M(8,'④b','妻が財布を（　　）いるので、妻の許可を得ないと買い物できない。','握って',['握る','握ら','ふさがって'],
   'Vợ tôi nắm giữ cái ví nên không có sự cho phép của vợ thì tôi không mua sắm được.',
   '<b>財布を握る</b> = nắm quyền chi tiêu trong nhà. 握っている = đang nắm giữ.')
  ]},
 /* ---------- 問題3 ---------- */
 {id:'b5s3', jp:'問題3', name:'Điền từ vào chỗ trống', type:'mc',
  hint:'Chọn đáp án phù hợp nhất điền vào chỗ trống （　　）.',
  hintJp:'（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。',
  qs:[
  {n:1, text:'型に（　　）絵は面白くない。', choices:['よせた','よんだ','はねた','はまった'], a:3,
   tr:'Bức tranh rập khuôn thì không thú vị.',
   vi:'<b>型にはまる</b> = rập khuôn, theo một khuôn mẫu cố định. Các đáp án còn lại không đi với 型に.'},
  {n:2, text:'法律に（　　）なければ何をしてもいいというわけではない。', choices:['ふれ','ふら','ふくらま','ふるえ'], a:0,
   tr:'Không phải cứ không vi phạm luật là muốn làm gì cũng được.',
   vi:'<b>法律に触れる</b> (ふれる) = vi phạm, đụng đến luật. 触れなければ = nếu không vi phạm.<ul><li>ふる (振る), ふくらむ, ふるえる (run) không đi với 法律に.</li></ul>'},
  {n:3, text:'運転手の不注意が大事故を（　　）こととなった。', choices:['ぶつかる','にらむ','とく','まねく'], a:3,
   tr:'Sự bất cẩn của tài xế đã dẫn đến một tai nạn lớn.',
   vi:'<b>事故を招く</b> = gây ra, dẫn đến tai nạn. 招く còn có nghĩa "gây ra hậu quả".'},
  {n:4, text:'話し合いの中で、意見が（　　）ことも少なくない。', choices:['はねる','あばれる','ふさがる','ぶつかる'], a:3,
   tr:'Trong lúc thảo luận, không ít khi ý kiến va chạm nhau.',
   vi:'<b>意見がぶつかる</b> = ý kiến xung đột nhau. はねる (bắn), あばれる (làm loạn), ふさがる (bị chặn) không hợp với 意見.'},
  {n:5, text:'卵をよく（　　）から、小麦粉を入れてください。', choices:['ふくらんで','といて','こぼして','つんで'], a:1,
   tr:'Hãy đánh đều trứng rồi cho bột mì vào.',
   vi:'<b>卵を溶く</b> (とく) = đánh tan trứng. Ở đây 溶く là chữ khác với 解く nhưng cùng cách đọc.<ul><li>ふくらんで: phồng; こぼして: làm đổ; つんで: chất lên — đều không hợp.</li></ul>'},
  {n:6, text:'油が（　　）ように、魚をそっと油の中に入れてください。', choices:['にえない','とけない','はねない','ぶつからない'], a:2,
   tr:'Hãy nhẹ nhàng cho cá vào dầu để dầu không bắn lên.',
   vi:'<b>油がはねる</b> = dầu bắn. 〜ないように = để không… Thả cá nhẹ nhàng để dầu không bắn.'},
  {n:7, text:'レポートの本文には、必ずページ番号を（　　）ください。', choices:['ぬって','よせて','ふれて','ふって'], a:3,
   tr:'Trong phần nội dung báo cáo, nhất định hãy đánh số trang.',
   vi:'<b>番号を振る</b> = đánh số. 振ってください = hãy đánh số.'},
  {n:8, text:'アメリカの大学に進学した友人の話を聞いて、ますます留学の夢が（　　）。', choices:['ちぢんだ','ふくらんだ','つんだ','ふさがった'], a:1,
   tr:'Nghe chuyện của người bạn học đại học ở Mỹ, ước mơ du học của tôi càng lớn dần.',
   vi:'<b>夢が膨らむ</b> = ước mơ nở rộng, lớn dần. ちぢむ là co lại (nghĩa ngược).'},
  {n:9, text:'監督は「今年こそ優勝できるだろう」と選手たちの活躍に期待を（　　）いる。', choices:['よせて','まねいて','つんで','にらんで'], a:0,
   tr:'Huấn luyện viên đặt kỳ vọng vào sự thi đấu của các tuyển thủ, cho rằng "năm nay nhất định có thể vô địch".',
   vi:'<b>期待を寄せる</b> = đặt kỳ vọng vào. 寄せている = đang đặt kỳ vọng.'},
  {n:10, text:'学校から帰る途中でバイクに（　　）、入院することになった。', choices:['ふさがって','だまされて','はまって','はねられて'], a:3,
   tr:'Trên đường từ trường về nhà tôi bị xe máy tông và phải nhập viện.',
   vi:'<b>バイクにはねられる</b> = bị xe máy tông (thể bị động của はねる).'}
  ]},
 /* ---------- 問題4 ---------- */
 {id:'b5s4', jp:'問題4', name:'Từ gần nghĩa', type:'mc',
  hint:'Chọn từ có nghĩa gần nhất với từ được gạch chân.',
  hintJp:'下線の言葉に意味が最も近いものを、1・2・3・4から一つ選びなさい。',
  qs:[
  {n:1, text:'妹は占いに<u>はまって</u>いる。', choices:['悩んで','夢中になって','慣れて','疑問を持って'], a:1,
   tr:'Em gái tôi đang mê bói toán.',
   vi:'<b>〜にはまる</b> (nghĩa mở rộng) = say mê, đắm chìm vào → <b>夢中になって</b>.<ul><li>悩む: khổ tâm; 慣れる: quen; 疑問を持つ: nghi ngờ.</li></ul>'},
  {n:2, text:'田中さんは今の学校教育をどう<u>とらえて</u>いらっしゃいますか。', choices:['行って','考えて','調べて','教えて'], a:1,
   tr:'Anh Tanaka nhìn nhận nền giáo dục học đường hiện nay như thế nào?',
   vi:'<b>とらえる</b> (nghĩa mở rộng) = nhìn nhận, hiểu theo cách nào đó → <b>考えて</b>.'},
  {n:3, text:'彼の言っていることは、半分以上うそだと<u>にらんで</u>いる。', choices:['知って','思って','聞いて','言って'], a:1,
   tr:'Tôi đoán những gì anh ta nói hơn nửa là nói dối.',
   vi:'<b>にらむ</b> (nghĩa mở rộng) = ngờ, đoán (có căn cứ) → <b>思って</b>.'},
  {n:4, text:'来月まで予定が<u>ふさがって</u>いる。', choices:['わかって','届いて','空いて','入って'], a:3,
   tr:'Lịch của tôi đã kín cho đến tháng sau.',
   vi:'<b>予定がふさがる</b> = lịch đã kín, đã có việc → <b>入って</b> (予定が入っている).<ul><li>空いて: còn trống (nghĩa ngược).</li></ul>'},
  {n:5, text:'「子育てこころの相談室」では数多くのご相談のメールを<u>お寄せ</u>いただいています。', choices:['お読み','お取り','お受け','お送り'], a:3,
   tr:'Ở "Phòng tư vấn tâm lý nuôi dạy con", chúng tôi đã nhận được rất nhiều email xin tư vấn.',
   vi:'<b>メールを寄せる</b> = gửi (thư, mail) đến → <b>お送り</b>. お〜いただく là cách nói khiêm nhường.'}
  ]},
 /* ---------- 問題5 ---------- */
 {id:'b5s5', jp:'問題5', name:'Cách dùng từ', type:'mc', usage:true,
  hint:'Chọn câu dùng từ đã cho đúng nhất.',
  hintJp:'次の言葉の使い方として最もよいものを、1・2・3・4から一つ選びなさい。',
  qs:[
  {n:1, text:'にぎる', choices:['商品の特徴をよく<u>にぎらない</u>と、よい広告は作れない。','犯人は自転車で逃げたが、あっという間に警官に<u>にぎられた</u>。','そこの壁は汚れているので、<u>にぎらない</u>ように注意してください。','あの女が事件のかぎを<u>にぎって</u>いるに違いない。'], a:3,
   vi:'<b>かぎを握る</b> = nắm giữ mấu chốt (của vụ án). Câu 4 đúng: "Người phụ nữ đó chắc chắn nắm chìa khóa của vụ án".<ul><li>Câu 1: nắm bắt đặc trưng là <b>つかむ</b>.</li><li>Câu 2: bị cảnh sát bắt là <b>つかまる／とらえられる</b>.</li><li>Câu 3: đụng vào tường là <b>触れない</b>.</li></ul>'},
  {n:2, text:'つむ', choices:['日本チームの活躍に、全国民が期待を<u>つんで</u>いる。','もっと練習を<u>つめば</u>、君も試合に出場できるよ。','車に女性を<u>つむ</u>のは初めてだったので、とても緊張した。','お名前にひらがなでふりがなを<u>つんで</u>いただけますか。'], a:1,
   vi:'<b>練習を積む</b> = luyện tập nhiều, tích lũy. Câu 2 đúng: "Nếu luyện tập nhiều hơn thì em cũng có thể ra sân đấu".<ul><li>Câu 1: dùng <b>期待を寄せる</b>.</li><li>Câu 3: chở người lên xe là <b>乗せる</b> (積む chỉ dùng cho đồ vật).</li><li>Câu 4: ghi furigana là <b>振る／ふってください</b>.</li></ul>'},
  {n:3, text:'ぶつかる', choices:['この話が社長の耳に<u>ぶつかった</u>ら大変だ。','料理をしているときに、油が手に<u>ぶつかって</u>、やけどをしてしまった。','祝日が日曜と<u>ぶつかる</u>場合、月曜日も休みになる。','入り口が荷物で<u>ぶつかって</u>いて、中に入れない。'], a:2,
   vi:'<b>〜とぶつかる</b> = trùng với (ngày/giờ). Câu 3 đúng: "Nếu ngày lễ trùng với Chủ nhật thì thứ Hai cũng nghỉ".<ul><li>Câu 1: lọt đến tai là <b>入る</b>.</li><li>Câu 2: dầu bắn vào tay là <b>はねる</b>.</li><li>Câu 4: lối vào bị chặn là <b>ふさがる</b>.</li></ul>'},
  {n:4, text:'とく', choices:['誤解を<u>とかない</u>ように、もっとはっきり説明したほうがいい。','彼女は困難な問題に<u>といて</u>も、けっして夢をあきらめなかった。','娘が真剣な表情でパズルを<u>といて</u>いる。','ウサギがぴょんぴょん<u>といて</u>いる。'], a:2,

const S={view:'home', examId:null, secIdx:0, answers:{}, picks:{}, perm:{}, msg:{}, shuffle:false, active:null, showTr:false, pairs:{}, sel:null};
const app=document.getElementById('app');
const exam=()=>EXAMS.find(e=>e.id===S.examId);
const keyOf=(sec,q)=>sec.id+'-'+q.n;
const isActive=k=>!S.active||S.active.has(k);
const secQs=sec=>sec.qs.filter(q=>isActive(keyOf(sec,q)));
const secList=()=>exam().sections.filter(sec=>secQs(sec).length);
const isDone=(sec,q)=>{const k=keyOf(sec,q); return sec.type==='order'?(S.picks[k]||[]).length===4:S.answers[k]!==undefined};
const isOk=(sec,q)=>{const k=keyOf(sec,q); return sec.type==='order'?(S.picks[k]||[]).join()===q.order.join():S.answers[k]===q.a};
const allActive=()=>{const out=[]; secList().forEach(sec=>secQs(sec).forEach(q=>out.push({sec,q,k:keyOf(sec,q)}))); return out};
const LET=['A','B','C','D'];
const GOOD=['Chính xác! Giỏi quá!','Tuyệt vời, đúng rồi!','Meo! Làm tốt lắm!','Đúng rồi, cứ thế phát huy nhé!'];
const BAD=['Tiếc quá, cùng xem lại nhé.','Không sao, sai để nhớ lâu hơn!','Gần được rồi, xem giải thích nhé.','Meo… lần sau sẽ đúng thôi!'];
const rnd=a=>a[Math.floor(Math.random()*a.length)];

function shuffled(n){const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]} return a}
function makePerm(){
  S.perm={};
  exam().sections.forEach(sec=>{ if(sec.type!=='mc') return;
    sec.qs.forEach(q=>{ const k=keyOf(sec,q); if(!isActive(k)) return;
      S.perm[k]=(S.shuffle&&!q.fixed)?shuffled(q.choices.length):[...q.choices.keys()];
    });
  });
}

function startExam(id){
  S.examId=id; S.active=null; S.answers={}; S.picks={}; S.pairs={}; S.sel=null; S.msg={}; S.secIdx=0; S.showTr=false;
  makePerm(); renderQuiz();
}
function retryWrong(){
  const wrong=allActive().filter(x=>!isOk(x.sec,x.q)).map(x=>x.k);
  if(!wrong.length) return;
  S.active=new Set(wrong);
  wrong.forEach(k=>{delete S.answers[k]; delete S.picks[k]; delete S.msg[k]; delete S.pairs[k]}); S.sel=null;
  S.secIdx=0; S.showTr=false; makePerm(); renderQuiz();
}

  })}</p>`).join('');

}

const BLANK1=/[（［][\s　]*[）］]/;
const blankHtml=t=>text=>text.replace(BLANK,m=>`<span class="blank">${m[0]==='［'?'［　　］':'（　　）'}</span>`);
const fillMark=(text,ch)=>{const ps=ch.split('/');let i=0;return text.replace(BLANK,()=>`<mark>${ps[Math.min(i++,ps.length-1)]}</mark>`)};
const fullOf=q=>q.full||(BLANK1.test(q.text)?fillMark(q.text,q.choices[q.a]):'');
function mcHtml(sec,q){
  const k=keyOf(sec,q), chosen=S.answers[k], done=chosen!==undefined;
  const order=S.perm[k]||[...q.choices.keys()];
  const long=q.choices.some(c=>plain(c).length>14);
  const num=`<span class="qn">${q.n}</span>`;
  const head = sec.usage
    ? `<div class="q-head">${num}<div class="qtext"><span class="tgt">${q.text}</span></div></div>`
    : (sec.reading&&q.stem)
    ? `<div class="q-head">${num}<div class="qtext"><b>${q.label||('【'+q.n+'】')}</b> chọn đáp án phù hợp</div></div><div class="stem">${q.stem.replace(/【(\d)(‑[ab])?】/g,(m)=>`<span class="blank">${m}</span>`)}</div>`
    : `<div class="q-head">${num}<div class="qtext">${q.tag?`<span class="grp">${q.tag}</span> `:''}${blankHtml()(q.text)}</div></div>`;
  const ch=order.map((oi,pos)=>{
    let cls='choice', mk='';
    if(done){ if(oi===q.a){cls+=' right'; mk='<span class="mk">Đáp án</span>'} else if(oi===chosen){cls+=' wrong'; mk='<span class="mk">Bạn chọn</span>'} else cls+=' dim'; }
    return `<button class="${cls}" data-act="pick" data-k="${k}" data-i="${oi}" ${done?'disabled':''}><span class="let">${LET[pos]}</span><span class="ct">${q.choices[oi]}</span>${mk}</button>`;
  }).join('');
  let ex='';
  if(done){
    const ok=chosen===q.a;
    const full = fullOf(q);
    ex=`<div class="explain ${ok?'ok':'no'}">
      <div class="ex-top">${cat(ok?'happy':'sad',58)}<div class="bubble">${S.msg[k]}</div></div>
      ${full?`<p><span class="lbl">Câu hoàn chỉnh</span><br><span class="jp">${full}</span></p>`:''}
      ${q.tr?`<p><span class="lbl">Dịch nghĩa</span><br>${q.tr}</p>`:''}
      <div><span class="lbl">Giải thích</span><br>${q.vi}</div></div>`;
  }
  return `<article class="q" id="q-${k}">${head}<div class="choices ${long?'long':''}">${ch}</div>${ex}</article>`;
}

function orderHtml(sec,q){
  const k=keyOf(sec,q), picks=S.picks[k]||[], done=picks.length===4, ok=done&&isOk(sec,q);
  const slots=[0,1,2,3].map(i=>{
    const f=picks[i]; let cls='slot'+(i===2&&!sec.nostar?' star':'');
    if(f){ cls+=' filled'; if(done) cls+= (f===q.order[i])?' ok':' no'; }
    else cls+=' empty';
    const inner=f?q.f[f]:(i===2&&!sec.nostar?'★':'…');
    return done||!f ? `<span class="${cls}">${inner}</span>` : `<button class="${cls}" data-act="unslot" data-k="${k}" data-i="${i}" title="Chạm để bỏ mảnh này">${inner}</button>`;
  }).join('');
  const frags=Object.keys(q.f).map(f=>`<button class="frag" data-act="frag" data-k="${k}" data-f="${f}" ${(picks.includes(f)||done)?'disabled':''}><span class="let">${LET['abcd'.indexOf(f)]}</span>${q.f[f]}</button>`).join('');
  let ex='';
  if(done){
    const star=q.f[q.order[2]];
    const sent=q.pre+q.order.map((f,i)=>(i===2&&!sec.nostar)?`<mark>${q.f[f]}</mark>`:q.f[f]).join('')+q.post;
    ex=`<div class="explain ${ok?'ok':'no'}">
      <div class="ex-top">${cat(ok?'happy':'sad',58)}<div class="bubble">${S.msg[k]}</div></div>
      ${sec.nostar?'':`<p class="ex-star"><span class="lbl" style="margin:0">Đáp án ô ★</span><b>${star}</b></p>`}
      <p><span class="lbl">Câu hoàn chỉnh</span><br><span class="jp">${q.ctx?q.ctx+'<br>':''}${sent}</span></p>
      <p><span class="lbl">Dịch nghĩa</span><br>${q.tr}</p>
      <div><span class="lbl">Giải thích</span><br>${q.vi}</div></div>`;
  }
  return `<article class="q" id="q-${k}">
    <div class="q-head"><span class="qn">${q.n}</span><div class="qtext">${q.ctx?`<span class="ctx">${q.ctx}</span>`:''}</div></div>
    <div class="order-line">${q.pre}${slots}${q.post}</div>
    <div class="frags">${frags}</div>
    ${done?'':`<div class="order-tools"><button class="link" data-act="reset" data-k="${k}" ${picks.length?'':'disabled'}>Xếp lại từ đầu</button></div>`}
    ${ex}</article>`;
}

function boardHtml(sec,bi){
  const b=sec.boards[bi], rows=secQs(sec).filter(q=>q.board===bi); if(!rows.length) return '';
  const checked=rows.every(q=>S.answers[keyOf(sec,q)]!==undefined);
  const allPaired=rows.every(q=>S.pairs[keyOf(sec,q)]!==undefined);
  const okN=rows.filter(q=>isOk(sec,q)).length;
  const selRow=rows.find(q=>keyOf(sec,q)===S.sel);
  const rowsH=rows.map((q,ri)=>{
    const k=keyOf(sec,q), pv=S.pairs[k], ans=S.answers[k], done=ans!==undefined;
    let cls='mrow c'+(ri%6)+(S.sel===k?' sel':'')+(pv!==undefined?' paired':'');
    if(done) cls+=(ans===q.a?' ok':' no');
    const inner=`<span class="qn">${ri+1}</span><span class="mtext jp">${q.text}</span><span class="mslot">${pv!==undefined?b.rights[pv]:'…'}</span>`;
    const btn=done?`<div class="${cls}">${inner}</div>`:`<button class="${cls}" data-act="mrow" data-k="${k}">${inner}</button>`;
    const un=(!done&&pv!==undefined)?`<button class="munpair" data-act="munpair" data-k="${k}" title="Gỡ nối">✕</button>`:'';
    const ok=done&&ans===q.a;
    const ex=done?`<div class="explain ok-${ok?1:0} ${ok?'ok':'no'}" style="margin:0 0 10px"><p><b>${ok?'✓ Đúng':'✕ Sai'}</b> · Đáp án: <span class="jp"><b>${b.rights[q.a]}</b></span></p><div>${q.vi}</div></div>`:'';
    return `<div class="mwrap">${btn}${un}</div>${ex}`;
  }).join('');
  const chips=b.rights.map((r,i)=>{
    const owner=rows.findIndex(q=>S.pairs[keyOf(sec,q)]===i);
    return `<button class="mchip${owner>=0?' used c'+(owner%6):''}" data-act="mright" data-b="${bi}" data-i="${i}" ${checked?'disabled':''}>${r}</button>`;
  }).join('');
  const hint=checked?'':(selRow?'Giờ chạm cụm bên phải để nối với nhóm đã chọn.':'Chạm một nhóm bên trái trước, rồi chạm cụm bên phải.');
  return `<div class="mboard" id="board-${sec.id}-${bi}">
    <h3 class="mtitle">${b.title}</h3>
    <div class="mrows">${rowsH}</div>
    <div class="mchips-wrap"><span class="lbl">Cụm bên phải</span><div class="mchips">${chips}</div></div>
    <div class="mfoot">${checked?`<div class="mscore">Bảng ${b.title}: đúng ${okN} / ${rows.length}</div>`:`<span class="mhint">${hint}</span><button class="btn sm mint" data-act="mcheck" data-b="${bi}" ${allPaired?'':'disabled'}>Kiểm tra</button>`}</div>
  </div>`;
}
function refreshBoard(sec,bi){

  el.outerHTML=boardHtml(sec,bi); refreshChrome();
}
function secHtml(sec){
  const qs=secQs(sec);
  return `<section class="card sec">
    <div class="sec-head"><h2><span class="jp">${sec.jp}</span>${sec.name}</h2><p>${sec.hint}<span class="jp">${sec.hintJp}</span></p></div>
    ${sec.note?`<details class="gnote"><summary>📒 Ghi nhớ ngữ pháp</summary><div class="gbody">${sec.note}</div></details>`:''}
    ${sec.reading?passageHtml(sec):''}
    <div id="qs">${sec.type==='match'?sec.boards.map((b,bi)=>boardHtml(sec,bi)).join(''):qs.map(q=>sec.type==='order'?orderHtml(sec,q):mcHtml(sec,q)).join('')}</div>
  </section>`;
}

function renderQuiz(){
  S.view='quiz';
  const e=exam(), secs=secList(); if(S.secIdx>=secs.length) S.secIdx=0;
  app.innerHTML=`
  <div class="topbar"><div class="brand">${cat('normal',40)}<div><span class="jp">${e.title}</span> · ${e.tag}<small>Neko Ôn Tập</small></div></div>
    <div class="tb-btns">${e.group?`<button class="btn sm" data-act="opengroup" data-g="${e.group}">← Chọn phần khác</button>`:''}<button class="btn sm alt" data-act="home">Trang chủ</button></div></div>
  <div id="chrome">${chromeHtml()}</div>
  <div id="body">${secHtml(secs[S.secIdx])}</div>
  <div class="navrow" id="nav">${navHtml()}</div>
  ${S.showTr?trModal(secs[S.secIdx]):''}`;
  window.scrollTo(0,0);
}
function refreshQ(sec,q){
  const el=document.getElementById('q-'+keyOf(sec,q)); if(!el) return;
  el.outerHTML = sec.type==='order'?orderHtml(sec,q):mcHtml(sec,q);
  refreshChrome();
}
function trModal(sec){
  return `<div class="overlay" data-act="trbg"><div class="card modal" role="dialog" aria-modal="true" aria-label="Bản dịch tiếng Việt">
    <div class="modal-head"><h3>Bản dịch tiếng Việt</h3><button class="x" data-act="trx" aria-label="Đóng">✕</button></div>
    <div class="modal-body">${sec.passageVi.map((p,i)=>`<p><span class="pn">${sec.passageLabels?sec.passageLabels[i]:'§'+(i+1)}</span>${p}</p>`).join('')}${sec.passageNoteVi?`<p style="font-size:14px;color:var(--ink-soft)">${sec.passageNoteVi}</p>`:''}</div></div></div>`;
}

/* ================= KẾT QUẢ ================= */
function renderResults(){
  S.view='results';
  const all=allActive(), total=all.length, ok=all.filter(x=>isOk(x.sec,x.q)).length, pct=Math.round(ok/total*100), wrongN=total-ok;
  const mood=pct>=70?'happy':(pct>=40?'normal':'sad');
  const word=pct>=90?'Xuất sắc!':pct>=70?'Giỏi lắm!':pct>=50?'Khá rồi!':'Cố lên!';
  const say=pct===100?'Điểm tuyệt đối! Neko tự hào về bạn lắm!':pct>=70?'Làm tốt lắm! Xem lại vài câu sai để chắc hơn nhé.':pct>=50?'Được một nửa rồi, ôn lại các câu sai là tiến bộ ngay!':'Đừng nản nhé, đọc giải thích rồi thử lại các câu sai cùng Neko.';
  const e=exam();
  app.innerHTML=`
  <div class="topbar"><div class="brand">${cat('normal',40)}<div>Kết quả<small>${e.title} · ${e.tag}</small></div></div></div>
  <section class="card res-hero">
    <div class="res-score"><b>${ok}/${total}</b><span>${pct}% · ${word}</span></div>
    <div class="res-copy"><h2>Bạn đúng ${ok} trên ${total} câu</h2>
      <div class="row">${cat(mood,76)}<div class="bubble">${say}</div></div></div>
  </section>
  <div class="acts">
    <button class="btn" data-act="retrywrong" ${wrongN?'':'disabled'}>Làm lại ${wrongN} câu sai</button>
    <button class="btn alt" data-act="restart">Làm lại từ đầu</button>
    ${exam().group?`<button class="btn alt" data-act="opengroup" data-g="${exam().group}">Chọn phần khác</button>`:''}
    <button class="btn alt" data-act="home">Về trang chủ</button>
  </div>
  <div class="bd">${secList().map(sec=>{
    const qs=secQs(sec), c=qs.filter(q=>isOk(sec,q)).length;
    return `<div class="card bd-card"><div class="t"><span class="jp">${sec.jp}</span> · ${sec.name}</div><div class="f">${c} / ${qs.length}</div><div class="bar"><i style="width:${Math.round(c/qs.length*100)}%"></i></div></div>`}).join('')}</div>
  <h2 class="rv-title">Xem lại từng câu</h2>
  <div class="rv">${all.map(({sec,q,k})=>reviewItem(sec,q,k)).join('')}</div>
  <div class="acts" style="margin-top:22px">
    <button class="btn" data-act="retrywrong" ${wrongN?'':'disabled'}>Làm lại ${wrongN} câu sai</button>
    ${exam().group?`<button class="btn alt" data-act="opengroup" data-g="${exam().group}">Chọn phần khác</button>`:''}
    <button class="btn alt" data-act="home">Về trang chủ</button>
  </div>`;
  window.scrollTo(0,0);
}
function reviewItem(sec,q,k){
  const ok=isOk(sec,q), done=isDone(sec,q);
  let stem, mine, right, full;
  if(sec.type==='order'){
    stem=(q.ctx?q.ctx+'<br>':'')+q.pre+(sec.nostar?'［ ］［ ］［ ］［ ］':'［ ］［ ］［★］［ ］')+q.post;
    const p=S.picks[k]||[];
    mine=done?p.map(f=>q.f[f]).join(' → '):'';
    right=q.order.map(f=>q.f[f]).join(' → ');
    full=q.pre+q.order.map((f,i)=>(i===2&&!sec.nostar)?`<mark>${q.f[f]}</mark>`:q.f[f]).join('')+q.post;
  } else if(sec.type==='match'){
    const b=sec.boards[q.board]; stem=`${b.title} <span class="jp">${q.text}</span>`;
    mine=(done&&S.answers[k]>=0)?b.rights[S.answers[k]]:''; right=b.rights[q.a]; full='';
  } else {
    stem=sec.usage?`<span class="tgt">${q.text}</span>`:(sec.reading&&q.stem)?q.stem.replace(/【(\d)(‑[ab])?】/g,'<span class="blank">$&</span>'):blankHtml()(q.text);
    mine=done?q.choices[S.answers[k]]:'';
    right=q.choices[q.a];
    full=fullOf(q);
  }
  return `<article class="rv-item ${ok?'ok':'no'}">
    <div class="rv-top"><span class="st">${ok?'✓':'✕'}</span><span><span class="jp">${sec.jp}</span> · câu ${q.n}</span></div>
    <div class="rv-q">${q.tag?`<span class="grp">${q.tag}</span> `:''}${stem}</div>
    <div class="rv-ans">${ok?`<span class="right">${right}</span>`:`${done?`<span class="mine">${mine}</span>`:'<span class="mine">Chưa trả lời</span>'}<span class="right">${right}</span>`}</div>
    <details class="rv-ex" ${ok?'':'open'}><summary>Giải thích</summary><div class="body">
      ${full?`<p class="jp">${full}</p>`:''}${q.tr?`<p>${q.tr}</p>`:''}<div>${q.vi}</div></div></details>
  </article>`;
}

/* ================= SỰ KIỆN ================= */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act;
  if(a==='trbg'&&ev.target!==t) return;
  const secs=S.view==='quiz'?secList():null, sec=secs&&secs[S.secIdx];
  const qOf=k=>sec&&sec.qs.find(q=>keyOf(sec,q)===k);
  switch(a){
    case 'open': startExam(t.dataset.id); break;
    case 'opengroup': renderGroup(t.dataset.g); break;
    case 'home': S.showTr=false; renderHome(); break;
    case 'tab': S.secIdx=+t.dataset.i; S.showTr=false; renderQuiz(); break;
    case 'prev': if(S.secIdx>0){S.secIdx--; renderQuiz()} break;
    case 'next': if(S.secIdx<secs.length-1){S.secIdx++; renderQuiz()} break;
    case 'results': renderResults(); break;
    case 'restart': startExam(S.examId); break;
    case 'retrywrong': retryWrong(); break;
    case 'pick': { const q=qOf(t.dataset.k); if(!q||S.answers[t.dataset.k]!==undefined) break;
      const i=+t.dataset.i; S.answers[t.dataset.k]=i; S.msg[t.dataset.k]=rnd(i===q.a?GOOD:BAD); refreshQ(sec,q); break; }
    case 'frag': { const k=t.dataset.k, q=qOf(k); if(!q) break;
      const p=S.picks[k]=S.picks[k]||[]; if(p.length>=4||p.includes(t.dataset.f)) break;
      p.push(t.dataset.f); if(p.length===4) S.msg[k]=rnd(isOk(sec,q)?GOOD:BAD); refreshQ(sec,q); break; }
    case 'unslot': { const k=t.dataset.k, q=qOf(k); if(!q) break; const p=S.picks[k]||[]; if(p.length===4) break;
      S.picks[k]=p.slice(0,+t.dataset.i); refreshQ(sec,q); break; }
    case 'reset': { const k=t.dataset.k, q=qOf(k); if(!q) break; if((S.picks[k]||[]).length===4) break; S.picks[k]=[]; refreshQ(sec,q); break; }
    case 'mrow': { const k=t.dataset.k, q=qOf(k); if(!q) break; S.sel=(S.sel===k)?null:k; refreshBoard(sec,q.board); break; }
    case 'munpair': { const k=t.dataset.k, q=qOf(k); if(!q) break; delete S.pairs[k]; if(S.sel===k) S.sel=null; refreshBoard(sec,q.board); break; }
    case 'mright': { const bi=+t.dataset.b, i=+t.dataset.i, rows=secQs(sec).filter(q=>q.board===bi);
      let q=rows.find(x=>keyOf(sec,x)===S.sel); if(!q) q=rows.find(x=>S.pairs[keyOf(sec,x)]===undefined); if(!q) break;
      rows.forEach(x=>{ if(S.pairs[keyOf(sec,x)]===i) delete S.pairs[keyOf(sec,x)]; });
      S.pairs[keyOf(sec,q)]=i; S.sel=null; refreshBoard(sec,bi); break; }
    case 'mcheck': { const bi=+t.dataset.b, rows=secQs(sec).filter(q=>q.board===bi);
      if(!rows.every(q=>S.pairs[keyOf(sec,q)]!==undefined)) break;
      rows.forEach(q=>{ const k=keyOf(sec,q); S.answers[k]=S.pairs[k]; }); S.sel=null; refreshBoard(sec,bi); break; }
    case 'jump': { const el=document.getElementById('q-'+t.dataset.k); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); break; }
    case 'tr': S.showTr=true; document.body.insertAdjacentHTML('beforeend','<div id="trwrap">'+trModal(sec)+'</div>'); break;
    case 'trx': case 'trbg': S.showTr=false; { const w=document.getElementById('trwrap'); if(w) w.remove(); else renderQuiz(); } break;
  }
});
document.addEventListener('change',ev=>{ if(ev.target.id==='shuf') S.shuffle=ev.target.checked; });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&S.showTr){ S.showTr=false; const w=document.getElementById('trwrap'); if(w) w.remove(); } });

renderHome();
</script>

</body></html>
