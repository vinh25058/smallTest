<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Neko Ôn Tập</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: một cột giữa trang, thẻ "sticker" viền đậm + bóng cứng; mascot mèo Neko dẫn đường */
:root{
  --bg:#FFF3F3; --dot:#FFDDE5; --surface:#FFFFFF;
  --ink:#443342; --ink-soft:#7F6B7B; --line:#443342;
  --pink:#FFB3C7; --pink-soft:#FFE6ED; --on-pink:#443342;
  --mint:#A6E6CC; --mint-soft:#E0F8EE; --mint-ink:#16704F;
  --sky:#AEDAF6; --sky-soft:#E6F4FD;
  --butter:#FFDB82; --butter-soft:#FFF4D1;
  --bad:#FF9E9E; --bad-soft:#FFE5E2; --bad-ink:#A93030;
  --cat:#FFFFFF; --cat-line:#443342;
  --f-display:'Fredoka','Zen Maru Gothic','Nunito',system-ui,sans-serif;
  --f-body:'Nunito','Zen Maru Gothic',system-ui,sans-serif;
  --f-jp:'Zen Maru Gothic','Nunito','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241B29; --dot:#2E2334; --surface:#352A3C;
    --ink:#FBEFF4; --ink-soft:#C3AEBC; --line:#9A83A6;
    --pink:#A24A6C; --pink-soft:#4B2D3D; --on-pink:#FFF4F8;
    --mint:#2F8C6A; --mint-soft:#1F3B33; --mint-ink:#8EE6C3;
    --sky:#3F7BA3; --sky-soft:#22364A;
    --butter:#C99A2E; --butter-soft:#463C22;
    --bad:#B84E57; --bad-soft:#472629; --bad-ink:#FFA9A9;
    --cat:#F7EAF0; --cat-line:#4A3A52; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241B29; --dot:#2E2334; --surface:#352A3C;
  --ink:#FBEFF4; --ink-soft:#C3AEBC; --line:#9A83A6;
  --pink:#A24A6C; --pink-soft:#4B2D3D; --on-pink:#FFF4F8;
  --mint:#2F8C6A; --mint-soft:#1F3B33; --mint-ink:#8EE6C3;
  --sky:#3F7BA3; --sky-soft:#22364A;
  --butter:#C99A2E; --butter-soft:#463C22;
  --bad:#B84E57; --bad-soft:#472629; --bad-ink:#FFA9A9;
  --cat:#F7EAF0; --cat-line:#4A3A52; color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background-color:var(--bg); color:var(--ink);
  background-image:radial-gradient(var(--dot) 2px, transparent 2px); background-size:26px 26px;
  font-family:var(--f-body); font-size:16px; line-height:1.65;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:18px 64px; overflow-x:hidden;
}
.wrap{max-width:860px; margin:0 auto}
h1,h2,h3{font-family:var(--f-display); font-weight:600; margin:0; text-wrap:balance; line-height:1.25}
p{margin:0}
.jp{font-family:var(--f-jp)}
ruby{ruby-position:over} rt{font-size:.5em; color:var(--ink-soft); font-weight:500; user-select:none}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--butter); outline-offset:2px}
.lbl{display:inline-block; font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-right:8px}

/* ---------- mascot ---------- */
.cat{display:block; flex:none}
.cat .fur{fill:var(--cat); stroke:var(--cat-line); stroke-width:3; stroke-linejoin:round}
.cat .ear{fill:var(--pink); stroke:none}
.cat .ln{fill:none; stroke:var(--cat-line); stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.cat .thin{stroke-width:2; opacity:.65}
.cat .dot{fill:var(--cat-line)}
.cat .cheek{fill:#FF9DB8; opacity:.55}
.cat .nose{fill:#FF7FA2; stroke:var(--cat-line); stroke-width:1.5; stroke-linejoin:round}
.cat .mouth{fill:#FF7FA2; stroke:var(--cat-line); stroke-width:2.5; stroke-linejoin:round}
.cat .tear{fill:#8FD0F5; stroke:var(--cat-line); stroke-width:1.5}
.cat .bow{fill:#FF7FA2; stroke:var(--cat-line); stroke-width:2; stroke-linejoin:round}

/* ---------- shared pieces ---------- */
.card{background:var(--surface); border:2.5px solid var(--line); border-radius:22px; box-shadow:0 5px 0 var(--line)}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; text-align:center;
  background:var(--pink); color:var(--on-pink); border:2.5px solid var(--line); border-radius:999px;
  padding:10px 22px; font-family:var(--f-display); font-weight:600; font-size:16px; line-height:1.2;
  box-shadow:0 4px 0 var(--line); transition:transform .08s, box-shadow .08s;
}
.btn:hover{transform:translateY(-1px); box-shadow:0 5px 0 var(--line)}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.btn.alt{background:var(--surface); color:var(--ink)}
.btn.mint{background:var(--mint); color:var(--on-pink)}
.btn.sm{padding:6px 14px; font-size:14px; box-shadow:0 3px 0 var(--line)}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none; box-shadow:0 4px 0 var(--line)}
.chip{display:inline-flex; align-items:center; gap:6px; background:var(--butter-soft); border:2px solid var(--line); border-radius:999px; padding:2px 12px; font-size:13px; font-weight:700}

/* ---------- top bar ---------- */
.tb-btns{display:flex; gap:8px; flex-wrap:wrap}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--f-display); font-weight:700; font-size:22px}
.brand small{font-family:var(--f-body); font-weight:700; font-size:12px; color:var(--ink-soft); display:block; margin-top:-4px}

/* ---------- home ---------- */
.hero{display:flex; align-items:center; gap:20px; padding:22px 24px; margin-bottom:26px; background:var(--pink-soft)}
.hero h1{font-size:30px; margin-bottom:6px}
.hero p{color:var(--ink-soft); max-width:46ch}
@media (max-width:560px){ .hero{flex-direction:column; text-align:center; padding:18px 16px} .hero h1{font-size:26px} }
.shuffle{display:flex; align-items:center; gap:10px; margin:0 0 18px; padding:10px 16px; background:var(--sky-soft); border:2px dashed var(--line); border-radius:16px; font-weight:700; font-size:15px; cursor:pointer}
.shuffle input{width:20px; height:20px; accent-color:#E0668B; flex:none}
.shuffle span span{display:block; font-weight:400; font-size:13px; color:var(--ink-soft)}
.exams{display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.exam{padding:20px; display:flex; flex-direction:column; gap:12px}
.exam .tag{align-self:flex-start; background:var(--butter); color:var(--on-pink); border:2px solid var(--line); border-radius:999px; padding:1px 14px; font-family:var(--f-display); font-weight:600; font-size:14px}
.exam h2{font-size:26px}
.exam ul{margin:0; padding:0; list-style:none; display:grid; gap:6px; font-size:15px}
.exam li{display:flex; gap:10px; align-items:baseline}
.exam li b{font-family:var(--f-jp); font-weight:700; flex:none}
.exam .btn{margin-top:auto; align-self:stretch}
.exam.soon{border-style:dashed; box-shadow:none; background:transparent; justify-content:center; align-items:center; text-align:center; color:var(--ink-soft); min-height:220px}
.exam.soon h2{font-size:20px; color:var(--ink)}

/* ---------- quiz chrome ---------- */
.prog{display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap}
.prog .bar{flex:1 1 160px; height:16px; background:var(--surface); border:2.5px solid var(--line); border-radius:999px; overflow:hidden}
.prog .bar i{display:block; height:100%; background:var(--mint); border-right:2.5px solid var(--line); transition:width .3s}
.prog .bar i[style*="width:0%"]{border-right:none}
.prog .txt{font-family:var(--f-display); font-weight:600; font-size:15px; white-space:nowrap}
.banner{background:var(--butter-soft); border:2px dashed var(--line); border-radius:14px; padding:8px 14px; font-weight:700; font-size:14px; margin-bottom:14px}
.tabs{display:flex; gap:10px; overflow-x:auto; padding:2px 2px 10px; margin-bottom:6px}
.tab{
  flex:1 1 0; min-width:132px; text-align:left; background:var(--surface); border:2.5px solid var(--line); border-radius:16px;
  padding:8px 14px; box-shadow:0 3px 0 var(--line); display:flex; flex-direction:column; gap:0;
}
.tab b{font-family:var(--f-jp); font-size:16px; line-height:1.3}
.tab span{font-size:13px; color:var(--ink-soft); font-weight:700}
.tab.on{background:var(--pink); color:var(--on-pink)}
.tab.on span{color:var(--on-pink)}
.tab.full span::after{content:" ✓"; color:var(--mint-ink); font-weight:800}
.tab.on.full span::after{color:var(--on-pink)}

.sec{padding:22px 24px 8px; margin-bottom:22px}
@media (max-width:560px){ .sec{padding:16px 14px 4px} }
.sec-head{margin-bottom:18px}
.sec-head h2{font-size:24px; display:flex; flex-wrap:wrap; align-items:baseline; gap:10px}
.sec-head h2 .jp{background:var(--sky); color:var(--on-pink); border:2px solid var(--line); border-radius:10px; padding:0 10px; font-size:18px}
.sec-head p{color:var(--ink-soft); font-size:15px; margin-top:6px}
.sec-head p .jp{font-size:13px; display:block; opacity:.85}

/* ---------- questions ---------- */
.q{padding:16px 0 22px; border-top:2.5px dashed var(--dot)}
.q:first-of-type{border-top:none; padding-top:0}
.q-head{display:flex; gap:12px; align-items:flex-start; margin-bottom:14px}
.qn{flex:none; width:36px; height:36px; border-radius:50%; background:var(--butter); color:var(--on-pink); border:2.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:700; font-size:16px; margin-top:2px}
.qtext{font-family:var(--f-jp); font-size:18px; line-height:2; padding-top:1px; min-width:0}
.qtext .ctx{display:block; color:var(--ink-soft); font-size:15px}
.blank{display:inline-block; min-width:3.2em; text-align:center; border-bottom:3px solid #E0668B; color:#C0305F; font-weight:700; margin:0 2px; line-height:1.3}
:root[data-theme="dark"] .blank{color:#FF9DB8; border-color:#FF9DB8}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .blank{color:#FF9DB8; border-color:#FF9DB8} }
.choices{display:grid; gap:10px; grid-template-columns:repeat(2,minmax(0,1fr)); padding-left:48px}
.choices.long{grid-template-columns:1fr}
@media (max-width:640px){ .choices{grid-template-columns:1fr; padding-left:0} }
.choice{
  display:flex; align-items:center; gap:12px; text-align:left; width:100%;
  background:var(--surface); border:2.5px solid var(--line); border-radius:16px; padding:10px 14px;
  font-family:var(--f-jp); font-size:17px; line-height:1.5; transition:transform .08s, background .12s;
}
.choice:hover:not([disabled]){background:var(--pink-soft); transform:translateY(-1px)}
.choice[disabled]{cursor:default}
.choice .let{flex:none; width:28px; height:28px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:700; font-size:14px; background:var(--sky-soft)}
.choice .ct{flex:1 1 auto}
.choice .mk{flex:none; font-family:var(--f-body); font-weight:800; font-size:13px}
.choice.right{background:var(--mint-soft); border-color:var(--mint-ink)}
.choice.right .let{background:var(--mint); color:var(--on-pink); border-color:var(--mint-ink)}
.choice.right .mk{color:var(--mint-ink)}
.choice.wrong{background:var(--bad-soft); border-color:var(--bad-ink)}
.choice.wrong .let{background:var(--bad); color:var(--on-pink); border-color:var(--bad-ink)}
.choice.wrong .mk{color:var(--bad-ink)}
.choice.dim{opacity:.6}

/* explain */
.explain{margin:14px 0 0 48px; padding:14px 16px; border:2.5px solid var(--line); border-radius:18px; font-size:15px; display:grid; gap:10px; animation:pop .25s ease}
@media (max-width:640px){ .explain{margin-left:0} }
.explain.ok{background:var(--mint-soft)} .explain.no{background:var(--bad-soft)}
.ex-top{display:flex; align-items:center; gap:12px}
.bubble{position:relative; background:var(--surface); border:2.5px solid var(--line); border-radius:16px; padding:6px 14px; font-family:var(--f-display); font-weight:600; font-size:16px; line-height:1.35}
.bubble::before{content:""; position:absolute; left:-9px; top:50%; width:14px; height:14px; margin-top:-7px; background:var(--surface); border-left:2.5px solid var(--line); border-bottom:2.5px solid var(--line); transform:rotate(45deg)}
.explain .jp{font-size:17px}
.explain ul{margin:6px 0 0; padding-left:20px; display:grid; gap:2px}
.explain b{font-weight:800}
.ex-star{display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap}
.ex-star b{background:var(--butter); color:var(--on-pink); border:2px solid var(--line); border-radius:10px; padding:0 10px; font-family:var(--f-jp)}
mark{background:var(--butter); color:var(--on-pink); border-radius:6px; padding:0 4px}
u{text-decoration:none; border-bottom:3px solid #E0668B; font-weight:700; padding-bottom:1px}
:root[data-theme="dark"] u{border-color:#FF9DB8}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) u{border-color:#FF9DB8} }
.tgt{display:inline-block; font-family:var(--f-jp); font-size:22px; font-weight:700; background:var(--butter-soft); border:2.5px solid var(--line); border-radius:12px; padding:0 14px; line-height:1.7}
.plab{display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; margin-right:8px; border-radius:8px; background:var(--sky); color:var(--on-pink); border:2px solid var(--line); font-family:var(--f-display); font-weight:700; font-size:15px; line-height:1; vertical-align:middle}
.pnote{font-family:var(--f-jp); font-size:14px; color:var(--ink-soft); margin:2px 4px 14px; line-height:1.7}
@keyframes pop{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}

/* ordering */
.order-line{font-family:var(--f-jp); font-size:18px; line-height:2.5; margin:0 0 6px 48px}
@media (max-width:640px){ .order-line{margin-left:0} }
.slot{
  display:inline-flex; align-items:center; justify-content:center; position:relative; min-width:76px; height:38px; padding:0 10px; margin:0 3px;
  background:var(--surface); border:2.5px dashed var(--line); border-radius:12px; font-size:16px; vertical-align:middle; line-height:1;
}
button.slot{cursor:pointer}
.slot.star{border-color:#E0668B; background:var(--butter-soft)}
.slot.star::before{content:"★"; position:absolute; top:-16px; left:50%; transform:translateX(-50%); font-size:16px; color:#E0A400; line-height:1}
.slot.filled{border-style:solid}
.slot.ok{background:var(--mint-soft); border-color:var(--mint-ink); border-style:solid}
.slot.no{background:var(--bad-soft); border-color:var(--bad-ink); border-style:solid}
.slot.empty{color:var(--ink-soft)}
.frags{display:flex; flex-wrap:wrap; gap:10px; margin-left:48px}
@media (max-width:640px){ .frags{margin-left:0} }
.frag{display:inline-flex; align-items:center; gap:8px; background:var(--sky-soft); border:2.5px solid var(--line); border-radius:14px; padding:8px 14px; font-family:var(--f-jp); font-size:16px; box-shadow:0 3px 0 var(--line); transition:transform .08s}
.frag:hover:not([disabled]){transform:translateY(-2px)}
.frag:active:not([disabled]){transform:translateY(2px); box-shadow:0 1px 0 var(--line)}
.frag .let{width:22px; height:22px; border-radius:50%; background:var(--surface); border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:700; font-size:12px}
.frag[disabled]{opacity:.35; box-shadow:none; cursor:default}
.order-tools{margin:12px 0 0 48px}
@media (max-width:640px){ .order-tools{margin-left:0} }
.link{background:none; border:none; color:var(--ink-soft); text-decoration:underline; text-underline-offset:3px; font-size:14px; font-weight:700; padding:2px 0}

/* passage */
.passage{background:var(--butter-soft); border:2.5px solid var(--line); border-radius:18px; padding:18px 20px; margin-bottom:8px; font-family:var(--f-jp); font-size:17px; line-height:2.15}
@media (max-width:560px){ .passage{padding:14px 14px; font-size:16px} }
.passage p{margin-bottom:14px} .passage p:last-child{margin-bottom:0}
.pb{display:inline-block; font-family:var(--f-display); font-weight:700; font-size:15px; line-height:1.4; padding:0 10px; margin:0 3px; background:var(--surface); color:#C0305F; border:2px dashed #E0668B; border-radius:10px}
:root[data-theme="dark"] .pb{color:#FF9DB8; border-color:#FF9DB8}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pb{color:#FF9DB8; border-color:#FF9DB8} }
.pb.ok{background:var(--mint); color:var(--on-pink); border:2px solid var(--mint-ink)}
.pb.no{background:var(--bad); color:var(--on-pink); border:2px solid var(--bad-ink)}
.ptools{display:flex; justify-content:flex-end; margin:0 0 12px}
.stem{font-family:var(--f-jp); font-size:16px; line-height:1.9; background:var(--sky-soft); border-radius:12px; padding:6px 12px; margin:0 0 12px 48px; color:var(--ink)}
@media (max-width:640px){ .stem{margin-left:0} }

/* modal */
.overlay{position:fixed; inset:0; z-index:50; background:rgba(40,28,44,.55); display:flex; align-items:center; justify-content:center; padding:max(16px, env(safe-area-inset-top,0px)) 16px max(16px, env(safe-area-inset-bottom,0px)); animation:pop .2s ease}
.modal{max-width:680px; width:100%; max-height:84vh; display:flex; flex-direction:column; overflow:hidden}
.modal-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px; border-bottom:2.5px solid var(--line); background:var(--pink-soft)}
.modal-head h3{font-size:19px}
.modal-body{padding:16px 20px 20px; overflow-y:auto; display:grid; gap:14px; font-size:16px}
.modal-body .pn{display:inline-block; font-family:var(--f-display); font-weight:700; font-size:12px; background:var(--butter); color:var(--on-pink); border:2px solid var(--line); border-radius:8px; padding:0 8px; margin-right:8px}
.x{width:36px; height:36px; border-radius:50%; background:var(--surface); border:2.5px solid var(--line); font-weight:800; line-height:1; flex:none}

/* nav */
.navrow{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:4px}
.navrow .hint{font-family:var(--f-display); font-weight:600; font-size:14px; color:var(--ink-soft)}
@media (max-width:480px){ .navrow .hint{order:3; width:100%; text-align:center} }

/* ---------- results ---------- */
.res-hero{display:flex; gap:22px; align-items:center; padding:22px 24px; margin-bottom:22px; background:var(--butter-soft); flex-wrap:wrap}
.res-score{flex:none; width:128px; height:128px; border-radius:50%; background:var(--pink); color:var(--on-pink); border:3px solid var(--line); box-shadow:0 5px 0 var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; transform:rotate(-6deg); font-family:var(--f-display)}
.res-score b{font-size:38px; line-height:1; font-weight:700} .res-score span{font-size:14px; font-weight:600}
.res-copy{flex:1 1 260px}
.res-copy h2{font-size:26px; margin-bottom:6px}
.res-copy .row{display:flex; align-items:center; gap:12px; margin-top:8px}
.res-copy .bubble{font-size:15px}
.acts{display:flex; gap:12px; flex-wrap:wrap; margin:0 0 24px}
.bd{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr)); margin-bottom:26px}
.bd-card{padding:12px 16px}
.bd-card .t{font-size:14px; font-weight:700}
.bd-card .f{font-family:var(--f-display); font-size:24px; font-weight:700}
.bd-card .bar{height:10px; background:var(--dot); border-radius:999px; overflow:hidden; border:2px solid var(--line); margin-top:6px}
.bd-card .bar i{display:block; height:100%; background:var(--mint)}
.rv-title{font-size:22px; margin:0 0 12px}
.rv{display:grid; gap:12px}
.rv-item{padding:14px 16px; border:2.5px solid var(--line); border-radius:18px; background:var(--surface)}
.rv-item.ok{border-left-width:10px; border-left-color:var(--mint-ink)}
.rv-item.no{border-left-width:10px; border-left-color:var(--bad-ink)}

const GN={
 kawakiri:'<b>〜を皮切りに（して／として）</b> = "bắt đầu từ…, rồi tiếp tục nhiều việc khác". Vế sau là <b>chuỗi sự việc nối tiếp, mở rộng</b> (nhiều nơi, liên tục), không dùng với mệnh lệnh hay một sự việc đơn lẻ.<br>Ví dụ: 東京公演を皮切りに、全国ツアーが始まった。',
 itaru:'<b>〜に至るまで</b> = "cho đến tận…, ngay cả…", nhấn mạnh <b>phạm vi rộng, gồm cả những thứ nhỏ/cực đoan</b>. Hay đi cùng <b>〜はもちろん</b> hoặc <b>AからBに至るまで</b>.<br>Ví dụ: 子どもからお年寄りに至るまで楽しめる。',
 kagiri:'<b>〜を限りに</b> = "lấy… làm mốc kết thúc". Trước đó là <b>danh từ chỉ thời điểm</b> (今日, 今月, 今年…), sau đó là việc <b>chấm dứt</b> (辞める, 閉店する, 募集しない).<br>Ví dụ: 今月を限りに閉店します。',
 motte:'<b>〜をもって</b> (văn trang trọng) = "vào thời điểm…" dùng trong thông báo, thường là <b>kết thúc</b>: これをもって終了いたします / 3月末日をもって停止します.',
 tokoro:'<b>〜といったところだ</b> = "cùng lắm chỉ ở mức…, khoảng…". Đi với <b>con số/mức độ nhỏ</b>, hay kèm せいぜい.<br><b>〜といったところで</b> = "dù nói là… thì cũng chỉ ở mức…".<br>Ví dụ: 参加者はせいぜい10人といったところだ。',
 nari:'<b>〜なり〜なり</b> = "hoặc là… hoặc là…". Nêu <b>hai ví dụ cùng loại</b> làm phương án lựa chọn; vế sau thường là <b>khuyên, đề nghị, ý chí</b>.<br>Ví dụ: 電話なりメールなり、連絡してください。',
 deare:'<b>〜であれ〜であれ / 〜であろうと〜であろうと</b> = "dù là… hay là…, (đều như nhau)". Nêu <b>hai trường hợp đối lập/đại diện</b>, vế sau đúng cho mọi trường hợp.<br>Ví dụ: 大人であれ子どもであれ、ルールは守るべきだ。',
 toii:'<b>〜といい〜といい</b> = "cả… lẫn…". Nêu <b>hai ví dụ tiêu biểu cùng loại</b> rồi <b>đánh giá chung</b> (khen/chê) ở vế sau.<br>Ví dụ: 味といい値段といい、申し分ない。',
 toiwazu:'<b>〜といわず〜といわず</b> = "bất kể… hay…". Hai ví dụ <b>cùng nhóm</b> để bao quát toàn bộ (khắp nơi, lúc nào cũng), vế sau là trạng thái/hành động liên tục.<br>Ví dụ: 昼といわず夜といわず、工事の音がする。',
 nbakari:'<b>〜んばかり（に／の）</b> = "như thể sắp…, gần như…". Nối: <b>V-ない形 bỏ ない + んばかり</b> (する → せんばかり). Mô tả biểu hiện bên ngoài trông như sắp làm gì.<br>〜んばかりに + động từ/tính từ; 〜んばかりの + danh từ.<br>Ví dụ: 飛び上がらんばかりに喜んだ。',
 tobakari:'<b>〜とばかり（に）</b> = "như muốn nói rằng…". Trước とばかり là lời/ý nghĩ trích dẫn; vế sau là <b>hành động thể hiện thái độ, không nói ra thành lời</b>.<br>Ví dụ: 「帰れ」とばかりにドアを閉めた。',
 tomonaku:'<b>〜ともなく / 〜ともなしに</b> = "không chủ ý…, vô thức…".<br>(1) <b>V thể từ điển + ともなく + V</b>: 見るともなく見ている.<br>(2) <b>疑問詞 + ともなく</b>: どこからともなく / いつからともなく / だれともなく = "không rõ từ đâu/khi nào/ai".',
 nagara:'<b>〜ながら</b>: (1) "tuy…"; <b>涙ながらに語る</b> = vừa khóc vừa kể.<br>(2) <b>N ながらの N</b> = "giữ nguyên như vốn có": 昔ながらの町, 生まれながらの才能 (bẩm sinh).<br>Nối với <b>V ます形 bỏ ます</b> (生まれながら).',
 kirai:'<b>〜きらいがある</b> = "có khuynh hướng (không tốt)…". Chỉ dùng cho <b>khuynh hướng xấu/thiếu sót</b>, thường nhận xét về người khác.<br>Ví dụ: 彼は物事を大げさに言うきらいがある。'
};

const EXAMS=[{
 id:'ko1', no:1, tag:'Bộ đề 1', title:'小テスト',
 sections:[

 /* ---------- 問題5 ---------- */
 {id:'s5', jp:'問題5', name:'Ngữ pháp', type:'mc',
  hint:'Chọn đáp án phù hợp nhất điền vào chỗ trống （　　）.',
  hintJp:'次の文の（　　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。',
  qs:[
  {n:1, text:`今日はもう帰ろう。残業続きで${R('疲労','ひろう')}もたまっている（　　）。`,
   choices:['ことだし','ものだから','ためだし','なのだから'], a:0,
   tr:'Hôm nay về thôi. Tăng ca liên tục, mà mệt mỏi cũng đã tích tụ rồi.',
   vi:`<b>〜ことだし</b> = "vì… (lại còn…) nên", nêu lý do nhẹ nhàng cho một đề nghị hay quyết định (ở đây là 帰ろう). Nối với thể thường: 疲労もたまっている<b>ことだし</b>.<ul><li><b>ものだから</b>: nêu lý do kiểu biện minh, giải thích cho kết quả đã xảy ra; không hợp với câu rủ rê "帰ろう".</li><li><b>ためだし</b>: không phải cách nói tự nhiên (chỉ có 〜ためだ hoặc 〜ことだし).</li><li><b>なのだから</b>: "なの" chỉ nối với danh từ/tính từ な, không đứng sau động từ ている.</li></ul>`},
  {n:2, text:`当店の${R('工芸品','こうげいひん')}は、${R('職人','しょくにん')}が一つひとつ${R('精魂','せいこん')}（　　）作っております。`,
   choices:['につけ','において','をもって','をこめて'], a:3,
   tr:'Đồ thủ công của cửa hàng chúng tôi được các nghệ nhân dồn hết tâm huyết làm ra từng sản phẩm một.',
   vi:`<b>精魂をこめる</b> = dồn hết tâm huyết, tinh thần vào việc gì → 精魂<b>をこめて</b>作る.<ul><li><b>につけ</b>: "mỗi khi…" (見るにつけ).</li><li><b>において</b>: "tại, trong (nơi chốn, lĩnh vực)".</li><li><b>をもって</b>: "bằng (phương tiện, thời điểm)"; không kết hợp với 精魂 để chỉ "dồn tâm huyết".</li></ul>`},
  {n:3, text:`周囲の期待を（　　）、彼女はせっかく決まった一流会社の${R('内定','ないてい')}を${R('蹴','け')}ってしまった。`,
   choices:['しりめに','ふまえて','こたえて','よそに'], a:3,
   tr:'Bất chấp kỳ vọng của mọi người xung quanh, cô ấy đã từ chối lời mời nhận việc của công ty hàng đầu mà vất vả lắm mới có được.',
   vi:`<b>〜をよそに</b> = "mặc kệ, bất chấp" (kỳ vọng, lo lắng của người xung quanh). Hợp với ý: bỏ ngoài tai kỳ vọng mà từ chối công ty tốt.<ul><li><b>しりめに</b>: cũng có nghĩa "làm ngơ", nhưng thường đi với việc đang diễn ra trước mắt (他人の成功を尻目に); với 期待 thì dùng をよそに mới tự nhiên.</li><li><b>ふまえて</b>: "dựa trên (tình hình, kết quả)".</li><li><b>こたえて</b>: "đáp lại", nhưng đi với に (期待<b>に</b>こたえて) và nghĩa ngược với câu.</li></ul>`},
  {n:4, text:`彼女は${R('生真面目','きまじめ')}で、他人のミスを指摘せずには（　　）らしい。`,
   choices:['いられない','ならない','たえない','できない'], a:0,
   tr:'Cô ấy là người cực kỳ nghiêm túc, nghe nói không thể không chỉ ra lỗi của người khác.',
   vi:`<b>〜ずにはいられない</b> = "không thể không…, không kìm được mà…" (= 〜ないではいられない). する → <b>せず</b>に: 指摘せずには<b>いられない</b>. Đằng sau gắn thêm <b>らしい</b> (nghe nói/có vẻ).<ul><li><b>ならない</b>: chỉ đi với 〜てならない (không chịu nổi), không đi với 〜ずには.</li><li><b>たえない</b>: 〜に堪えない (không đành nhìn/nghe).</li><li><b>できない</b>: không có dạng 〜ずにはできない.</li></ul>`},
  {n:5, text:`（大学で）<br>Ａさん：「これから郵便局に${R('速達','そくたつ')}を出しに行かなきゃなんないんだけど、Ｂさんの自転車、ちょっとの間、（　　）。」<br>Ｂさん：「うん、いいよ。使って。」`,
   choices:['使ってもらうならかまわない','使わせてもらわない','使わせてもらってもいいかな','使ってもらって'], a:2,
   tr:'A: "Bây giờ mình phải đi bưu điện gửi thư chuyển phát nhanh, cho mình dùng xe đạp của cậu một lát được không?" B: "Ừ, được thôi. Cứ dùng đi."',
   vi:`A xin phép dùng xe của B → dùng <b>使わせてもらう</b> (xin được cho dùng) + <b>〜てもいいかな</b> (xin phép, thân mật): <b>使わせてもらってもいいかな</b> = "cho mình dùng nhé?". Câu đáp "いいよ。使って。" của B cũng khớp.<ul><li><b>使ってもらうならかまわない</b>: 使ってもらう = nhờ người khác dùng, đổi mất chủ thể.</li><li><b>使わせてもらわない</b>: dạng phủ định "không xin dùng", mâu thuẫn.</li><li><b>使ってもらって</b>: câu bỏ lửng và cũng sai chủ thể.</li></ul>`},
  {n:6, text:`わずか半年という短い期間（　　）、新たな業務をいろいろ経験できたという意味では、いい職場だったといえる。`,
   choices:['だったものの','だったからには','だったくせに','だったとあって'], a:0,
   tr:'Tuy chỉ là khoảng thời gian ngắn ngủi nửa năm, nhưng xét ở việc đã được trải nghiệm nhiều công việc mới thì có thể nói đó là một nơi làm việc tốt.',
   vi:`<b>〜ものの</b> = "tuy… nhưng…" (quan hệ nghịch). "Tuy chỉ nửa năm ngắn ngủi, nhưng được trải nghiệm nhiều việc → nơi làm việc tốt".<ul><li><b>だったからには</b>: "một khi đã… thì phải…", thường đi kèm quyết tâm/nghĩa vụ.</li><li><b>だったくせに</b>: "vậy mà…", sắc thái chê trách người.</li><li><b>だったとあって</b>: "vì là… nên (kết quả đặc biệt)", không phải quan hệ nghịch.</li></ul>`},
  {n:7, text:`（館内の説明をする前に）<br>Ａさん：「皆さま、本日はようこそ当博物館にお越しくださいました。これからスタッフが館内を（　　）。」`,
   choices:['ご案内いただきます','ご案内されます','ご案内させられます','ご案内させていただきます'], a:3,

   vi:`Người nói là phía bảo tàng, nói về hành động của nhân viên phía mình với khách → dùng khiêm nhường ngữ: <b>ご案内させていただきます</b> = "xin phép được hướng dẫn".<ul><li><b>ご案内いただきます</b>: いただく = nhận từ người khác, thành "chúng tôi nhận được sự hướng dẫn", sai chiều.</li><li><b>ご案内されます</b>: kính ngữ dành để tôn người làm hành động, không dùng cho nhân viên phía mình trước khách.</li><li><b>ご案内させられます</b>: thể bị động sai khiến, "bị bắt phải hướng dẫn".</li></ul>`},

   choices:['として','からして','をみて','にあって'], a:1,
   tr:'A: "Này, nghe chưa? Nghe nói công ty thực phẩm Number One phá sản rồi." B: "Đương nhiên thôi. Chỉ riêng cái tên công ty đã đáng ngờ rồi mà."',
   vi:`<b>〜からして</b> = "ngay từ… đã (như vậy)": lấy một chi tiết nhỏ nhất để cho thấy toàn thể. "Chỉ riêng cái tên công ty (社名からして) đã đáng ngờ" nên phá sản là chuyện đương nhiên.<ul><li><b>として</b>: "với tư cách là".</li><li><b>をみて</b>: "nhìn vào", không nối tự nhiên với 胡散臭かった.</li><li><b>にあって</b>: "trong hoàn cảnh/ở vị trí".</li></ul>`},
  {n:9, text:`（電話で）<br>Ａ「はい、スズキ電気でございます。」<br>Ｂ「すみません、洗濯機の修理について（　　）。」`,
   choices:['お聞かせしたいんですが','お聞かせしましょうか','お伺いさせましょか','お伺いしたいんですが'], a:3,
   tr:'A: "Vâng, Suzuki Denki xin nghe ạ." B: "Xin lỗi, tôi muốn hỏi về việc sửa máy giặt ạ."',
   vi:`Gọi điện hỏi công ty → dùng khiêm nhường ngữ của 聞く: <b>お伺いしたいんですが</b> = "tôi muốn hỏi ạ".<ul><li><b>お聞かせしたい / お聞かせしましょうか</b>: 聞かせる = cho người khác nghe, tức "tôi muốn nói cho anh nghe", sai chiều.</li><li><b>お伺いさせましょか</b>: cấu trúc sai.</li></ul>`},
  {n:10, text:`${R('後輩','こうはい')}達には私たちの${R('代','だい')}が（　　）全国大会優勝を成し遂げてもらいたい。`,
   choices:['成しがたかった','成してやまなかった','成してならなかった','成しえなかった'], a:3,
   tr:'Tôi muốn các đàn em đạt được chức vô địch toàn quốc mà khóa chúng tôi đã không thể làm được.',
   vi:`<b>〜えない / 〜えなかった</b> (得る) = "không thể (làm)". Khóa chúng tôi <b>đã không thể</b> đạt được (成しえなかった) chức vô địch, nên muốn đàn em làm được.<ul><li><b>成しがたかった</b>: 〜がたい thường đi với động từ cảm xúc/nhận thức (信じがたい), không tự nhiên với 成す.</li><li><b>成してやまなかった</b>: 〜てやまない = "luôn mong…" (願ってやまない).</li><li><b>成してならなかった</b>: 〜てならない = "không chịu nổi…" (気になってならない).</li></ul>`}
  ]},

 /* ---------- 問題6 ---------- */
 {id:'s6', jp:'問題6', name:'Sắp xếp câu ★', type:'order',
  hint:'Chạm lần lượt 4 mảnh để xếp thành câu đúng. Sau đó xem mảnh nằm ở ô ★ nhé.',
  hintJp:'次の文の ★ に入る最もよいものを、1・2・3・4から一つ選びなさい。',
  qs:[
  {n:1, pre:'英語の辞書などに', post:'、減少するばかりか事態は一層深刻になっている。',
   f:{a:R('掲載','けいさい')+'されるほど', b:R('過労死','かろうし')+'であるが', c:'国際語となった', d:'そのまま'}, order:['d','a','c','b'],
   tr:'"Karoshi" (chết vì làm việc quá sức) đã trở thành từ quốc tế đến mức được đưa nguyên vẹn vào các từ điển tiếng Anh, nhưng không những không giảm mà tình hình còn nghiêm trọng hơn.',
   vi:`<b>〜ほど</b> = "đến mức…". <b>そのまま</b> bổ nghĩa cho 掲載される (được đăng nguyên như vậy). Cụm <b>国際語となった</b> bổ nghĩa cho danh từ 過労死 đứng ngay sau; <b>〜であるが</b> = "là…, nhưng", dẫn sang vế nghịch 減少するばかりか….<br>Thứ tự: そのまま → 掲載されるほど → <b>国際語となった</b> (★) → 過労死であるが.`},
  {n:2, pre:'全国高校サッカー選手権は5日、決勝が行われ、Ａ校が延長戦', post:'下し、初の優勝を果たした。',
   f:{a:'を', b:'Ｂ校', c:'末に', d:'の'}, order:['d','c','b','a'],
   tr:'Trận chung kết giải bóng đá học sinh cấp 3 toàn quốc diễn ra vào ngày 5; trường A đã đánh bại trường B sau hiệp phụ và lần đầu tiên giành chức vô địch.',
   vi:`<b>〜の末に</b> = "sau cả một quá trình (như hiệp phụ)… cuối cùng thì…". 下す (đánh bại) đi với <b>を</b>: B校<b>を</b>下し.<br>Thứ tự: の → 末に → <b>B校</b> (★) → を (延長戦の末にB校を下し).`},
  {n:3, ctx:'彼にまた貸した本を汚されちゃって、まいったよ。', pre:'一度', post:'となると、もう貸したくない。',
   f:{a:'二度三度', b:'だけ', c:'なら', d:'まだしも'}, order:['b','c','d','a'],
   tr:'Cậu ta lại làm bẩn quyển sách tôi cho mượn, thật hết nói nổi. Một lần thì còn chấp nhận được, chứ đến hai ba lần thì tôi không muốn cho mượn nữa.',
   vi:`<b>〜ならまだしも</b> = "nếu chỉ… thì còn chấp nhận được (chứ hơn thế thì không)". Vế sau 二度三度となると nói đến mức không chấp nhận nổi.<br>Thứ tự: だけ → なら → <b>まだしも</b> (★) → 二度三度 (一度だけならまだしも二度三度となると).`},
  {n:4, pre:'彼女は', post:'落ち着きぶりだった。',
   f:{a:'ベテラン', b:'ながら', c:'かと思うような', d:'新人'}, order:['d','b','a','c'],
   tr:'Cô ấy tuy là người mới nhưng điềm tĩnh đến mức khiến người ta tưởng là một người kỳ cựu.',
   vi:`<b>〜ながら</b> = "tuy (là)…". <b>〜かと思うような</b> = "như thể là…", bổ nghĩa cho 落ち着きぶり.<br>Thứ tự: 新人 → ながら → <b>ベテラン</b> (★) → かと思うような.`},
  {n:5, pre:'さんざん', post:'2分だった。',
   f:{a:'あげくに', b:'たったの', c:'待たされた', d:R('診察','しんさつ')+'が'}, order:['c','a','d','b'],
   tr:'Bị bắt chờ mãi, rốt cuộc buổi khám chỉ vỏn vẹn có 2 phút.',
   vi:`<b>さんざん 〜 あげくに</b> = "sau khi (làm/bị làm) hết sức…, rốt cuộc thì…" (thường kết quả không tốt). 待たされた là thể bị động sai khiến: "bị bắt chờ". たったの2分 = chỉ vỏn vẹn 2 phút.<br>Thứ tự: 待たされた → あげくに → <b>診察が</b> (★) → たったの.`}
  ]},

 /* ---------- 問題7 ---------- */
 {id:'s7', jp:'問題7', name:'Đọc hiểu', type:'mc', reading:true,
  hint:'Đọc đoạn văn rồi chọn đáp án phù hợp nhất cho mỗi chỗ trống 【1】–【5】.',
  hintJp:'次の文章を読んで、文章全体の趣旨を踏まえて、1から5の中に入る最もよいものを選びなさい。',
  passage:[
   `先日、こんな記事を目にして、私はひどく${R('切','せつ')}ない気持ちになった。${R('台風','たいふう')}が${R('首都圏','しゅとけん')}を${R('襲','おそ')}った日、駅周辺の${R('植','う')}え${R('込','こ')}みや駅構内の階段の手すりに、${R('壊','こわ')}れて使い物にならなくなったビニール傘が大量に${R('放置','ほうち')}され、山のようになっていたというのだ。`,
   `ビニール傘とは、その名の通り、ビニールで作られた${R('透明','とうめい')}な傘である。コンビニや100円ショップに行けば、安く手に入るため、非常に${R('身近','みぢか')}な存在となっている。ただ、その{{1}}、大事に長く使うものとは考えられていないというのも事実である。とはいうものの、あちらこちらで{{2}}ように思われる。日本の傘の${R('年間消費量','ねんかんしょうひりょう')}をみると、その数は日本の人口とほぼ同じ約1億3000万本、ビニール傘はその約9割を${R('占','し')}めている。`,
   `現在、世界では${R('資源','しげん')}のリサイクルに地球規模で取り組むようになってきており、{{3}}だろう。環境分野で初のノーベル平和賞を${R('受賞','じゅしょう')}したケニア人女性ワンガリ・マータイさんが、日本語の「もったいない」を、環境を守る世界共通語「MOTTAINAI」として広めることを${R('提唱','ていしょう')}した。彼女は、来日した際、${R('水洗','すいせん')}トイレのレバーが「大」「小」に分かれている点に{{4}}を感じたという。彼女のメッセージは、私たち日本人の意識にもちょっとした変化を与えた。{{5a}}、レバーの使い分けなど、当たり前のことすぎて、気にもかけないでいた。{{5b}}、「MOTTAINAI」が世界に知られたのをきっかけに、自然に節約が意識されている日本社会を${R('誇','ほこ')}りに思うようになったのだ。`,
   `毎年1億本以上のビニール傘が消費されている現実に${R('少','すく')}なからずショックを受けたあなた、「もったいない」という言葉が${R('死語','しご')}になってしまわないように、まずは1つ「MOTTAINAI」ことをやめてみてはどうだろうか。`
  ],
  passageVi:[
   'Hôm trước, tôi đọc được một bài báo và cảm thấy vô cùng xót xa. Vào ngày bão đổ bộ vùng thủ đô, những chiếc ô nhựa đã hỏng, không còn dùng được nữa, bị vứt la liệt với số lượng lớn ở các bụi cây quanh ga và trên tay vịn cầu thang trong nhà ga, chất cao như núi.',
   'Ô nhựa (ビニール傘), đúng như tên gọi, là loại ô trong suốt làm bằng nhựa vinyl. Vì mua được rẻ ở cửa hàng tiện lợi hay cửa hàng 100 yên nên nó trở thành thứ vô cùng quen thuộc. Tuy nhiên, cũng đúng là chính vì rẻ nên nó không được coi là món đồ để dùng cẩn thận và lâu dài. Dù vậy, có vẻ như ở khắp nơi nó đang bị đối xử quá sơ sài. Nhìn vào lượng ô tiêu thụ hằng năm của Nhật Bản, con số này xấp xỉ bằng dân số Nhật, khoảng 130 triệu chiếc, trong đó ô nhựa chiếm khoảng 90%.',
   'Hiện nay, trên thế giới, việc tái chế tài nguyên đang được thực hiện trên quy mô toàn cầu, và có lẽ cũng có nhiều nước chú ý đến việc phân loại rác. Bà Wangari Maathai, người phụ nữ Kenya đầu tiên nhận giải Nobel Hòa bình ở lĩnh vực môi trường, đã đề xướng việc lan truyền từ "mottainai" trong tiếng Nhật thành từ chung toàn thế giới "MOTTAINAI" để bảo vệ môi trường. Khi đến Nhật, bà kể rằng mình cảm nhận được ý thức tiết kiệm nước cao của người Nhật ở chỗ cần xả bồn cầu chia thành "lớn" và "nhỏ". Thông điệp của bà đã mang lại một chút thay đổi trong nhận thức của người Nhật chúng ta. Cho đến lúc đó, việc dùng phân biệt cần xả là chuyện quá đỗi hiển nhiên nên chúng ta chẳng để tâm. Thế nhưng, nhân dịp "MOTTAINAI" được thế giới biết đến, chúng ta tự nhiên bắt đầu tự hào về xã hội Nhật Bản, nơi việc tiết kiệm được ý thức một cách tự nhiên.',
   'Nếu bạn là người đã khá sốc trước thực tế mỗi năm có hơn 100 triệu chiếc ô nhựa bị tiêu thụ, thì để từ "mottainai" không trở thành từ chết, trước hết hãy thử bỏ đi một việc "MOTTAINAI" xem sao.'
  ],
  qs:[
  {n:1, label:'【1】', stem:'ただ、その【1】、大事に長く使うものとは考えられていないというのも事実である。',
   choices:['軽さゆえに','手軽ささえ','安さゆえに','格安ささえ'], a:2,
   full:'ただ、その<mark>安さゆえに</mark>、大事に長く使うものとは考えられていないというのも事実である。',
   tr:'Tuy nhiên, cũng đúng là chính vì rẻ nên chúng không được coi là thứ để dùng cẩn thận và lâu dài.',
   vi:`Ngay trước đó bài viết nói ô nhựa mua được <b>rẻ</b> ở cửa hàng tiện lợi, nên vế sau "không được trân trọng dùng lâu" là hệ quả của giá rẻ → <b>安さゆえに</b>. <b>〜ゆえに</b> = "vì, do" (văn viết).<ul><li><b>軽さゆえに</b>: "vì nhẹ" không liên quan đến việc không giữ gìn.</li><li><b>手軽ささえ / 格安ささえ</b>: さえ = "ngay cả/chỉ cần", không tạo quan hệ nguyên nhân – kết quả với vế sau; 格安さ cũng không phải cách nói tự nhiên.</li></ul>`},
  {n:2, label:'【2】', stem:'とはいうものの、あちらこちらで【2】ように思われる。',
   choices:['粗末に扱われすぎている','差別的に買いすぎている','長く持ちすぎている','大事にされすぎている'], a:0,
   full:'とはいうものの、あちらこちらで<mark>粗末に扱われすぎている</mark>ように思われる。',
   tr:'Dù vậy, có vẻ như ở khắp nơi chúng đang bị đối xử quá sơ sài (bị coi nhẹ, vứt bỏ tùy tiện).',
   vi:`Mạch văn: ô nhựa không được coi là đồ dùng lâu dài → <b>とはいうものの</b> ("tuy nói vậy") → thực tế khắp nơi nó <b>bị đối xử quá sơ sài</b> (粗末に扱われすぎている), đúng với cảnh ô hỏng bị vứt thành đống và con số 130 triệu chiếc mỗi năm.<ul><li><b>大事にされすぎている / 長く持ちすぎている</b>: ngược hẳn với nội dung bài.</li><li><b>差別的に買いすぎている</b>: vô nghĩa trong ngữ cảnh.</li></ul>`},
  {n:3, label:'【3】', stem:'現在、世界では資源のリサイクルに地球規模で取り組むようになってきており、【3】だろう。',
   choices:['ゴミの分別を意識している国も多い。','ゴミの分別を忘れている国も多い。','ゴミの重要性を意識している国は多くない。','ゴミの重要性を忘れている国は多くない。'], a:0,
   full:'現在、世界では資源のリサイクルに地球規模で取り組むようになってきており、<mark>ゴミの分別を意識している国も多い</mark>だろう。',
   tr:'Hiện nay, trên thế giới việc tái chế tài nguyên đang được thực hiện trên quy mô toàn cầu, và có lẽ cũng có nhiều nước chú ý đến việc phân loại rác.',
   vi:`Vế trước nói thế giới <b>ngày càng nỗ lực tái chế tài nguyên</b>, nên vế sau phải đi cùng hướng: nhiều nước đang chú ý phân loại rác (<b>ゴミの分別を意識している国も多い</b>).<ul><li><b>分別を忘れている</b> và <b>重要性を意識している国は多くない</b>: đi ngược xu hướng "đang nỗ lực" ở vế trước.</li><li><b>重要性を忘れている国は多くない</b>: ý gần đúng nhưng nói về "tầm quan trọng của rác" thì không tự nhiên và không cụ thể như việc phân loại rác.</li></ul>`},
  {n:4, label:'【4】', stem:'彼女は、来日した際、水洗トイレのレバーが「大」「小」に分かれている点に【4】を感じたという。',
   choices:['日本人の防水意識の低さ','ケニア人の防水意識の高さ','日本人の節水意識の低さ','日本人の節水意識の高さ'], a:3,
   full:'彼女は、来日した際、水洗トイレのレバーが「大」「小」に分かれている点に<mark>日本人の節水意識の高さ</mark>を感じたという。',
   tr:'Khi đến Nhật, bà kể rằng mình cảm nhận được ý thức tiết kiệm nước cao của người Nhật ở chỗ cần xả bồn cầu chia thành "lớn" và "nhỏ".',
   vi:`Cần xả chia "lớn/nhỏ" giúp dùng nước vừa đủ → bà Maathai cảm nhận <b>ý thức tiết kiệm nước (節水) cao</b> của <b>người Nhật</b> (日本人の節水意識の高さ). Đây cũng là tinh thần "mottainai" mà bà muốn lan tỏa.<ul><li><b>防水</b> = chống thấm nước, không liên quan.</li><li><b>ケニア人</b>: người cảm nhận là bà Maathai (người Kenya), đối tượng được nhận xét là người Nhật.</li><li><b>低さ</b>: bà đánh giá cao nên không thể là "thấp".</li></ul>`},
  {n:5, label:'【5】(a・b)', fixed:true, stem:'【5‑a】、レバーの使い分けなど、当たり前のことすぎて、気にもかけないでいた。【5‑b】、「MOTTAINAI」が世界に知られたのをきっかけに、自然に節約が意識されている日本社会を誇りに思うようになったのだ。',
   choices:['a それまでは ／ b ところが','a それからは ／ b そこで','a そのくせ ／ b しかし','a それはそうと ／ b したがって'], a:0,
   full:'<mark>それまでは</mark>、レバーの使い分けなど、当たり前のことすぎて、気にもかけないでいた。<mark>ところが</mark>、「MOTTAINAI」が世界に知られたのをきっかけに、自然に節約が意識されている日本社会を誇りに思うようになったのだ。',
   tr:'Cho đến lúc đó, việc dùng phân biệt cần xả là chuyện quá hiển nhiên nên chúng ta chẳng để tâm. Thế nhưng, nhân dịp "MOTTAINAI" được thế giới biết đến, chúng ta bắt đầu tự hào về xã hội Nhật Bản, nơi việc tiết kiệm được ý thức một cách tự nhiên.',
   vi:`Đoạn văn mô tả sự thay đổi nhận thức theo trục "trước – sau" khi thông điệp của bà Maathai lan ra.<br><b>a: それまでは</b> = "cho đến lúc đó" (trước đây không để ý đến cần xả). <b>b: ところが</b> = "thế nhưng" (sau khi MOTTAINAI nổi tiếng thì lại tự hào).<ul><li><b>それからは / そこで</b>: "từ đó về sau" và "vì vậy"; a nói về thái độ trước đây nên không thể là "từ đó về sau".</li><li><b>そのくせ / しかし</b>: そのくせ = "vậy mà" (chê trách), không hợp.</li><li><b>それはそうと / したがって</b>: "nhân tiện" (đổi chủ đề) và "do đó", đều phá mạch đối lập trước – sau.</li></ul>`}
  ]}
 ]
},
{
 id:'ko2', no:2, tag:'Bộ đề 2', title:'小テスト 2',
 sections:[

 /* ---------- 問題1 ---------- */
 {id:'b2s1', jp:'問題1', name:'Đọc kanji', type:'mc',
  hint:'Chọn cách đọc đúng của từ được gạch chân.',
  hintJp:'＿＿の言葉の読み方として最もよいものを、1・2・3・4から一つ選びなさい。',
  qs:[
  {n:1, text:'彼は料理の<u>修業</u>のためにフランスに行くことにした。',
   choices:['しゅごう','しゅぎょう','しゅうごう','しゅうぎょう'], a:1,
   tr:'Anh ấy quyết định sang Pháp để học nghề nấu ăn.',
   vi:'<b>修業（しゅぎょう）</b> = học nghề, rèn luyện tay nghề. Chú ý 業 đọc <b>ぎょう</b> và âm "しゅ" ngắn.<ul><li>しゅうぎょう là cách đọc của 就業 (đi làm) hoặc 終業 (kết thúc giờ làm), không phải 修業.</li><li>しゅごう, しゅうごう không phải cách đọc của từ này.</li></ul>'},
  {n:2, text:'彼女のことは<u>潔く</u>あきらめよう。',
   choices:['こころよく','いちじるしく','はなはだしく','いさぎよく'], a:3,
   tr:'Mình sẽ dứt khoát từ bỏ cô ấy.',
   vi:'<b>潔い（いさぎよい）</b> = dứt khoát, gọn gàng, không lưu luyến → 潔く = <b>いさぎよく</b>.<ul><li>快く (こころよく): vui lòng, sẵn lòng.</li><li>著しく (いちじるしく): rõ rệt, đáng kể.</li><li>甚だしく (はなはだしく): quá mức.</li></ul>'},
  {n:3, text:'若者の消費行動を<u>分析</u>した。',

   tr:'Đã phân tích hành vi tiêu dùng của giới trẻ.',
   vi:'<b>分析（ぶんせき）</b> = phân tích. 析 đọc <b>せき</b>. Các đáp án còn lại (ぶんせつ, ぶんき, ぶんきん) không phải cách đọc của từ nào cả.'},
  {n:4, text:'Ａ国はＢ国からの援助の申し出を頑なに<u>拒んで</u>いる。',
   choices:['おがんで','はばんで','こばんで','ねたんで'], a:2,
   tr:'Nước A kiên quyết từ chối đề nghị viện trợ từ nước B.',
   vi:'<b>拒む（こばむ）</b> = từ chối, cự tuyệt → 拒んで = <b>こばんで</b>.<ul><li>拝む (おがむ): cầu nguyện, vái lạy.</li><li>阻む (はばむ): ngăn cản.</li><li>妬む (ねたむ): ghen tị.</li></ul>'},
  {n:5, text:'ここは<u>精密</u>な機械を作る工場だ。',
   choices:['しんみつ','せいみつ','きみつ','ちみつ'], a:1,
   tr:'Đây là nhà máy chế tạo máy móc chính xác.',
   vi:'<b>精密（せいみつ）</b> = tinh vi, chính xác. 精 đọc <b>せい</b>, 密 đọc <b>みつ</b>.<ul><li>きみつ: 機密 (bí mật).</li><li>ちみつ: 緻密 (tỉ mỉ, kỹ lưỡng), dễ nhầm vì cùng đuôi みつ.</li></ul>'},

   vi:'<b>合間（あいま）</b> = khoảng trống, lúc nghỉ giữa hai việc. Đây là từ đọc theo kun (合 = あい, 間 = ま).'}

 /* ---------- 問題5 ---------- */
 {id:'b2s5', jp:'問題5', name:'Đọc hiểu', type:'mc', reading:true,
  hint:'Đọc đoạn văn rồi trả lời các câu hỏi bên dưới (có hai chỗ trống 【A】【B】 trong bài).',
  hintJp:'次の文章を読んで、後の問いに対する答えとして最もよいものを、1・2・3・4から一つ選びなさい。',
  passage:[
   `${R('町工場','まちこうば')}というと技術力もなく大企業の${R('下請','したう')}け仕事ばかりやっているところという印象だろうが、日本には小さいながらも大企業を超える技術を持つ町工場もある。町工場でも技術いかんでオンリーワンの製品が生産できるのである。サッカーの${R('審判','しんぱん')}の笛、競技用のボールから痛くない注射針、手術用${R('顕微鏡','けんびきょう')}など、大企業も真似できない製品を作っているところもある。製品ではないが${R('研磨','けんま')}力(注)で世界一を誇る会社もある。しかし普通の町工場は経済のグローバル化や不況で${R('廃業','はいぎょう')}に${R('追','お')}い${R('込','こ')}まれつつある。そして町工場の減少と共に以前は${R('活気','かっき')}に${R('溢','あふ')}れていた町もまた${R('寂','さび')}れてきている。`,
   `そんな中、${R('衰退','すいたい')}しっぱなしの町に活気を取り戻そうと大阪の町工場が集まり本業の{{1|（Ａ）}}人工衛星の打ち上げを目指した。2009年に「まいど1号」という人工衛星の打ち上げに成功して世間を驚かせた。しかしよく考えてみると元からある高い技術力を${R('結集','けっしゅう')}した結果だから{{2|（Ｂ）}}。人工衛星は9ヶ月間宇宙に留まり${R('雷','かみなり')}の${R('観測','かんそく')}などの成果を上げた。それはただ町工場の人たちの夢の実現であるのみならず、町工場の技術力を示す出来事でもあり、普通の人々をも${R('力','ちから')}づけることであった。`,
   `日本の工業を長年支えてきたのはこのような町工場である。しかし人工衛星を上げても<u>状況は変わらない</u>。工場自身の努力や仲間同士で協力しているだけでは限界がある。今こそ国の${R('支援','しえん')}が必要なのではないだろうか。町工場の${R('喪失','そうしつ')}は技術の喪失であり日本産業全体の衰退に${R('繋','つな')}がる。町工場が生き残れるように何とかして欲しいと思う。`
  ],
  passageNote:'(注) 研磨：物の表面をなめらかにするために磨くこと',
  passageVi:[
   'Nhắc đến xưởng nhỏ (町工場), người ta thường có ấn tượng là nơi không có năng lực kỹ thuật, chỉ toàn nhận việc gia công thầu phụ cho doanh nghiệp lớn. Nhưng ở Nhật cũng có những xưởng nhỏ sở hữu kỹ thuật vượt cả doanh nghiệp lớn. Tùy vào kỹ thuật mà ngay cả xưởng nhỏ cũng làm ra được sản phẩm độc nhất vô nhị (only one). Có những nơi làm ra những sản phẩm mà doanh nghiệp lớn cũng không bắt chước nổi, như còi của trọng tài bóng đá, bóng thi đấu, kim tiêm không đau, kính hiển vi dùng trong phẫu thuật. Cũng có công ty tự hào số một thế giới về năng lực mài bóng (研磨), dù đó không phải là sản phẩm. Tuy nhiên, các xưởng nhỏ bình thường đang dần bị đẩy đến chỗ phải đóng cửa do toàn cầu hóa kinh tế và suy thoái. Và cùng với sự giảm đi của các xưởng nhỏ, những khu phố từng tràn đầy sức sống cũng dần trở nên vắng vẻ, tiêu điều.',
   'Trong bối cảnh đó, các xưởng nhỏ ở Osaka đã tập hợp lại, đặt mục tiêu phóng vệ tinh nhân tạo bên cạnh công việc chính, nhằm đem lại sức sống cho khu phố vốn cứ suy tàn. Năm 2009, họ phóng thành công vệ tinh "Maido 1" khiến dư luận kinh ngạc. Nhưng nghĩ kỹ thì đó là kết quả của việc tập trung kỹ thuật cao vốn có, nên cũng chẳng có gì đáng ngạc nhiên. Vệ tinh ở lại trong vũ trụ 9 tháng và đạt được những thành quả như quan trắc sét. Đó không chỉ là hiện thực hóa ước mơ của những người ở xưởng nhỏ, mà còn là sự kiện cho thấy năng lực kỹ thuật của xưởng nhỏ, và tiếp thêm sức mạnh cho cả những người bình thường.',
   'Chính những xưởng nhỏ như vậy đã nâng đỡ ngành công nghiệp Nhật Bản suốt nhiều năm. Thế nhưng dù có phóng được vệ tinh, tình hình vẫn không thay đổi. Chỉ dựa vào nỗ lực của bản thân từng xưởng và sự hợp tác giữa các xưởng thì có giới hạn. Chính bây giờ cần có sự hỗ trợ của nhà nước. Mất đi xưởng nhỏ là mất đi kỹ thuật, và dẫn tới sự suy thoái của toàn bộ nền công nghiệp Nhật Bản. Tôi mong bằng cách nào đó các xưởng nhỏ có thể tiếp tục sống sót.'
  ],
  passageNoteVi:'(Chú thích) 研磨: mài, đánh bóng bề mặt vật cho nhẵn mịn.',
  qs:[
  {n:1, text:'（Ａ）の中に最もよいものを入れなさい。',
   choices:['かたほう','そばから','かたがた','かたわら'], a:3,
   full:'そんな中、衰退しっぱなしの町に活気を取り戻そうと大阪の町工場が集まり本業の<mark>かたわら</mark>人工衛星の打ち上げを目指した。',
   tr:'Các xưởng nhỏ ở Osaka tập hợp lại, bên cạnh công việc chính còn đặt mục tiêu phóng vệ tinh nhân tạo.',
   vi:'<b>〜のかたわら</b> = "bên cạnh (việc chính) còn…", chỉ việc làm song song, kéo dài với công việc chính: 本業のかたわら人工衛星の打ち上げを目指した.<ul><li>かたほう: "một bên, một phía" (danh từ).</li><li>〜そばから: "vừa… là lại…" (làm xong là bị hỏng/quên ngay).</li><li>〜かたがた: "nhân tiện, kết hợp" khi làm một việc (như お礼かたがた), không dùng với 本業の.</li></ul>'},
  {n:2, text:'（Ｂ）の中に最もよいものを入れなさい。',
   choices:['驚くのは当たり前だ','驚くには当たらない','驚かないでもない','驚かないでは済まない'], a:1,
   full:'しかしよく考えてみると元からある高い技術力を結集した結果だから<mark>驚くには当たらない</mark>。',
   tr:'Nhưng nghĩ kỹ thì đó là kết quả của việc tập trung kỹ thuật cao vốn có, nên cũng chẳng có gì đáng ngạc nhiên.',
   vi:'<b>〜には当たらない</b> = "không đáng (để)…, không cần phải…". 驚くには当たらない = "không có gì đáng ngạc nhiên", vì đó chỉ là kết quả của việc tập trung kỹ thuật cao vốn có.<ul><li>驚くのは当たり前だ: "ngạc nhiên là đương nhiên", ngược mạch.</li><li>驚かないでもない: "cũng không hẳn là không ngạc nhiên" (hơi ngạc nhiên).</li><li>驚かないでは済まない: "không thể không ngạc nhiên / không thể bỏ qua".</li></ul>'},
  {n:3, text:'なぜ町工場は人工衛星を上げようとしたのか。',
   choices:['本業のほうが暇だったから','町を元気にしたいと考えたから','本業以外の仕事を増やしたかったから','夢がないと働けないから'], a:1,
   vi:'Đoạn 2 viết: "衰退しっぱなしの町に<b>活気を取り戻そうと</b>…人工衛星の打ち上げを目指した" → để đem lại sức sống cho khu phố. Các đáp án khác không có trong bài.'},
  {n:4, text:'「まいど1号」の成功の理由は何か。',
   choices:['人工衛星の部品が町工場で製造されていたから','町工場の夢の実現を願う人が多かったから','町工場が協力すれば何でも作れるから','町工場の技術水準がとても高かったから'], a:3,
   vi:'Bài viết: "元からある<b>高い技術力を結集した結果</b>" → lý do thành công là trình độ kỹ thuật rất cao của các xưởng nhỏ.<ul><li>Các đáp án còn lại (nguồn linh kiện, nhiều người mong muốn, "hợp tác thì làm gì cũng được") không được nêu làm lý do.</li></ul>'},
  {n:5, text:'<u>状況は変わらない</u>と言っているがどんな状況か。',
   choices:['生き残れない工場同士が協力し合っている状況','特別な製品の生産や特別な技術を持つ工場以外は消えていく状況','人工衛星の打ち上げで技術力を示したので仕事が確保できている状況','国の支援を受けることができる工場だけが生き残れる状況'], a:1,
   vi:'Ở đoạn 1, ngoài một số xưởng có sản phẩm/kỹ thuật đặc biệt, "普通の町工場は…廃業に追い込まれつつある". Dù đã phóng vệ tinh, tình hình đó vẫn không đổi → <b>trừ các xưởng có sản phẩm hoặc kỹ thuật đặc biệt, các xưởng còn lại vẫn dần biến mất</b>.<ul><li>Đáp án 1: bài chỉ nói chỉ hợp tác với nhau thì có giới hạn, không phải "tình hình".</li><li>Đáp án 3: ngược với "状況は変わらない".</li><li>Đáp án 4: tác giả đang kêu gọi nhà nước hỗ trợ, chưa có sự hỗ trợ đó.</li></ul>'}
  ]}
 ]
},
{
 id:'ko3', no:3, tag:'Bộ đề 3', title:'小テスト 3',
 sections:[

 /* ---------- 問題1 ---------- */
 {id:'b3s1', jp:'問題1', name:'Ngữ pháp', type:'mc',
  hint:'Chọn đáp án phù hợp nhất điền vào chỗ trống （　　）.',
  hintJp:'次の文の（　　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。',
  qs:[
  {n:1, text:'入社1年目にして新プロジェクトのリーダーを（　　）異例の人事だ。',
   choices:['任されるとして','任せられるにあたって','任せられるにあって','任されるとは'], a:3,
   tr:'Mới vào công ty năm đầu mà đã được giao làm trưởng nhóm dự án mới, đúng là một sự bổ nhiệm hiếm thấy.',
   vi:'<b>〜とは</b> đứng sau một sự việc để nêu sự ngạc nhiên, cảm thán: "…lại được giao làm leader, thật là (một sự bổ nhiệm ngoại lệ)". 任される là thể bị động của 任せる = "được giao phó".<ul><li><b>任されるとして</b>: "giả sử/với tư cách là…", không hợp nghĩa.</li><li><b>任せられるにあたって</b>: "nhân dịp/khi…", không hợp mạch.</li><li><b>任せられるにあって</b>: "trong hoàn cảnh/vị trí…", cũng không phù hợp.</li></ul>'},
  {n:2, text:'女性はいつから周りに人がいるの（　　）、化粧をするようになったのだろうか。',
   choices:['もかまわず','をものともせず','をよそに','もかかわらず'], a:0,
   tr:'Từ bao giờ phụ nữ bắt đầu trang điểm mà chẳng bận tâm có người xung quanh nhỉ?',
   vi:'<b>〜もかまわず</b> = "không bận tâm/không để ý đến…". 周りに人がいるのもかまわず = mặc kệ có người xung quanh.<ul><li><b>をものともせず</b>: "bất chấp (khó khăn, nguy hiểm)", đi với danh từ và mang nghĩa vượt qua trở ngại.</li><li><b>をよそに</b>: "mặc kệ", đi với danh từ (期待をよそに), không nối được với 〜のを.</li><li><b>もかかわらず</b>: sai hình thức, đúng phải là にもかかわらず.</li></ul>'},
  {n:3, text:'「差し支えなければ、こちらにお名前を（　　）。」',
   choices:['ご記入しますでしょうか','ご記入されますでしょうか','ご記入いただけますでしょうか','ご記入申し上げますでしょうか'], a:2,
   tr:'"Nếu không phiền, xin quý khách vui lòng điền tên vào đây ạ."',
   vi:'Nhờ khách điền tên → dùng mẫu nhờ vả lịch sự <b>ご記入いただけますでしょうか</b> (ご〜いただく = nhận hành động từ người trên, dạng khả năng "…có được không ạ").<ul><li><b>ご記入しますでしょうか</b>: khiêm nhường ngữ, là hành động của người nói, không phải nhờ khách.</li><li><b>ご記入されますでしょうか</b>: kính ngữ, nhưng chỉ hỏi "ngài sẽ điền chứ?", không có ý nhờ.</li><li><b>ご記入申し上げます</b>: khiêm nhường ngữ cho hành động của mình, sai chủ thể.</li></ul>'},
  {n:4, text:'うちの犬（　　）、だれに対してもしっぽを振ったりお腹を見せたりして、番犬として失格だな。',
   choices:['とすれば','ともなれば','ときたら','とは'], a:2,
   tr:'Con chó nhà tôi ấy à, với ai nó cũng vẫy đuôi, lăn ra phơi bụng, đúng là không đủ tư cách làm chó giữ nhà.',
   vi:'<b>〜ときたら</b> = "nói đến… thì (thật là…)", nêu chủ đề để phàn nàn, chê trách (thường là người hoặc vật thân thuộc): うちの犬ときたら….<ul><li><b>とすれば</b>: "nếu cho rằng…".</li><li><b>ともなれば</b>: "một khi đã đến mức/vị trí… thì".</li><li><b>とは</b>: dùng để nêu sự ngạc nhiên hay định nghĩa, không mang sắc thái phàn nàn này.</li></ul>'},
  {n:5, text:'3年間このマンションに住んでいるが、隣の人とは（　　）、顔を合わせたこともない。',
   choices:['話したこともないばかりで','話したこともないどころか','話したことがないばかりでも','話したことがないどころではなく'], a:1,
   tr:'Tôi sống ở chung cư này đã 3 năm, nhưng với người hàng xóm thì đừng nói là nói chuyện, đến mặt cũng chưa từng gặp.',
   vi:'<b>〜どころか</b> = "đừng nói là… ngay cả… cũng…", vế sau nêu mức độ cực đoan hơn hoặc ngược kỳ vọng. 話したこともないどころか、顔を合わせたこともない = chưa từng nói chuyện đã đành, đến mặt cũng chưa từng gặp.<ul><li><b>ばかりで / ばかりでも</b>: không tạo thành cách nói tự nhiên ở đây.</li><li><b>どころではなく</b>: "không phải lúc để…", sai nghĩa.</li></ul>'},
  {n:6, text:'この農家グループは、米や大豆の栽培（　　）、加工品の製造にも携わっている。',
   choices:['のかたわら','にともなって','のはんめん','もかねて'], a:0,
   tr:'Nhóm nông dân này, bên cạnh trồng gạo và đậu nành, còn tham gia chế biến sản phẩm.',
   vi:'<b>〜のかたわら</b> = "bên cạnh (việc chính) còn…". 栽培のかたわら、加工品の製造にも携わっている.<ul><li><b>にともなって</b>: "cùng với (sự thay đổi)…".</li><li><b>のはんめん</b>: "mặt khác" (phải là 〜である反面).</li><li><b>もかねて</b>: "kiêm, nhân tiện" (勉強もかねて旅行する), không hợp với vế sau.</li></ul>'},
  {n:7, text:'お金をもらってやる（　　）、中途半端なことはできない。',
   choices:['からして','からでは','からに','からには'], a:3,
   tr:'Đã nhận tiền để làm thì không thể làm nửa vời.',
   vi:'<b>〜からには</b> = "một khi đã… thì (phải…)", vế sau là nghĩa vụ hoặc quyết tâm. お金をもらってやるからには、中途半端なことはできない.<ul><li><b>からして</b>: "ngay từ… đã".</li><li><b>からでは / からに</b>: không phải mẫu ngữ pháp phù hợp.</li></ul>'},
  {n:8, text:'あんないい加減な連中に、こんな大役が（　　）。',
   choices:['務まるものか','務めるものだ','務めるものを','務まるものだが'], a:0,
   tr:'Cái đám cẩu thả như thế mà đảm đương nổi vai trò quan trọng thế này à? Đời nào!',
   vi:'<b>〜ものか</b> = "làm sao mà… được (phủ định mạnh)". 務まる = đảm đương được (tự động từ, đi với 大役が). 務まるものか = "đời nào đảm đương nổi".<ul><li><b>務めるものだ / 務めるものを / 務まるものだが</b>: 務める là tha động từ (cần を) và các mẫu này không diễn đạt ý phản vấn.</li></ul>'},
  {n:9, text:'（会社で）<br>Ａ「鈴木さんの送別会、どこにしましょうか。鈴木さんが気に入ってくれそうなところにしたいと思うんですが。」<br>Ｂ「そうねえ、お好み焼き屋（　　）、どうかしら？テーブルを囲んでみんなでわいわいできて、いいじゃない？」',
   choices:['ならば','とすると','っていうのは','といえば'], a:2,
   tr:'A: "Tiệc chia tay anh Suzuki mình tổ chức ở đâu đây? Tôi muốn chọn chỗ anh ấy sẽ thích." B: "Ừm, quán okonomiyaki thì sao nhỉ? Ngồi quanh bàn rôm rả, hay đấy chứ?"',
   vi:'<b>〜っていうのは</b> (dạng nói của というのは) dùng để đưa ra một ý tưởng, đề xuất: "quán okonomiyaki thì sao?".<ul><li><b>ならば</b>: "nếu là… thì", cần điều kiện rõ ràng.</li><li><b>とすると</b>: "nếu cho là… thì".</li><li><b>といえば</b>: "nói đến… thì (nhớ ra)", dùng khi liên tưởng từ chủ đề, không phải để đề xuất.</li></ul>'},
  {n:10, text:'（大学で）<br>Ａ「この前出てた求人、受けるんでしょ？」<br>Ｂ「もちろん。めったにないチャンスを逃す（　　）。」',
   choices:['どころではないからね','ほどではないからね','わけにはいかないからね','ことにはいかないからね'], a:2,
   tr:'A: "Đợt tuyển dụng hôm trước, cậu sẽ ứng tuyển chứ?" B: "Tất nhiên. Cơ hội hiếm có như thế thì không thể bỏ lỡ được."',
   vi:'<b>〜わけにはいかない</b> = "không thể (vì lý do tình cảm/hoàn cảnh)…". めったにないチャンスを逃すわけにはいかない = không thể bỏ lỡ cơ hội hiếm có.<ul><li><b>どころではない</b>: "không phải lúc để…".</li><li><b>ほどではない</b>: "không đến mức…".</li><li><b>ことにはいかない</b>: không có dạng này (phải là わけにはいかない).</li></ul>'}
  ]},

 /* ---------- 問題2 ---------- */
 {id:'b3s2', jp:'問題2', name:'Sắp xếp câu ★', type:'order',
  hint:'Chạm lần lượt 4 mảnh để xếp thành câu đúng. Sau đó xem mảnh nằm ở ô ★ nhé.',
  hintJp:'次の文の ★ に入る最もよいものを、1・2・3・4から一つ選びなさい。',
  qs:[
  {n:1, pre:'ホームを歩きながら携帯電話などを操作する', post:'接触事故につながりかねない。',
   f:{a:'の', b:'電車と', c:'は', d:'こと'}, order:['d','c','b','a'],
   tr:'Việc vừa đi trên sân ga vừa thao tác điện thoại di động có thể dẫn đến tai nạn va chạm với tàu điện.',
   vi:'Danh từ hóa động từ bằng <b>こと</b>, kèm chủ đề <b>は</b>: 操作することは…. <b>電車との接触事故</b> = tai nạn va chạm với tàu điện. <b>〜かねない</b> = "có thể dẫn đến (điều xấu)".<br>Thứ tự: こと → は → <b>電車と</b> (★) → の.'},
  {n:2, pre:'今回の実験が上手く', post:'をあきらめることはない。',
   f:{a:'といって', b:'いかなかった', c:'研究自体', d:'から'}, order:['b','d','a','c'],
   tr:'Không phải vì lần thí nghiệm này không thành công mà phải từ bỏ chính việc nghiên cứu.',
   vi:'<b>〜からといって〜ない</b> = "không có nghĩa là / không vì… mà…". 上手くいかなかったからといって研究自体をあきらめることはない. <b>〜ことはない</b> = "không cần/không việc gì phải…".<br>Thứ tự: いかなかった → から → <b>といって</b> (★) → 研究自体.'},
  {n:3, pre:'転職先としては、これまでの経験を', post:'希望している。',
   f:{a:'キャリアアップを', b:'図れる', c:'生かしつつ', d:'会社を'}, order:['c','a','b','d'],
   tr:'Về nơi làm việc mới, tôi mong muốn một công ty nơi có thể vừa phát huy kinh nghiệm cho đến nay vừa nâng cao sự nghiệp.',
   vi:'<b>〜つつ</b> = "vừa… vừa…" (hai hành động song song). 経験を生かしつつ、キャリアアップを図れる会社を. <b>図れる</b> (図る = mưu cầu, tính đến, dạng khả năng) bổ nghĩa cho 会社.<br>Thứ tự: 生かしつつ → キャリアアップを → <b>図れる</b> (★) → 会社を.'},
  {n:4, pre:'何とか', post:'、将来に対して不安がないわけではない。',
   f:{a:'ものの', b:'ことは', c:'就職する', d:'できた'}, order:['c','b','d','a'],
   tr:'Tuy bằng cách nào đó đã xin được việc, nhưng không phải là tôi không bất an về tương lai.',
   vi:'<b>〜ものの</b> = "tuy… nhưng…". 就職することはできた = "ít nhất cũng đã xin được việc" (〜ことはできた). Vế sau nêu nỗi bất an.<br>Thứ tự: 就職する → ことは → <b>できた</b> (★) → ものの.'},

   f:{a:'留守がち', b:'共働きで', c:'ですが', d:'ペットを飼う'}, order:['b','a','c','d'],
   tr:'Nhà tôi vợ chồng đều đi làm nên hay vắng nhà, nhưng liệu có thể nuôi thú cưng không ạ?',
   vi:'<b>共働き</b> = vợ chồng cùng đi làm; <b>〜がち</b> = "hay, thường xuyên (xu hướng không mong muốn)", 留守がち = hay vắng nhà. <b>〜ですが</b> = "…nhưng", dẫn vào câu hỏi.<br>Thứ tự: 共働きで → 留守がち → <b>ですが</b> (★) → ペットを飼う.'}

 /* ---------- 問題3 ---------- */
 {id:'b3s3', jp:'問題3', name:'Đọc hiểu điền chỗ trống', type:'mc', reading:true,
  hint:'Đọc đoạn văn rồi chọn đáp án phù hợp nhất cho mỗi chỗ trống 【1】–【5】.',
  hintJp:'次の文章を読んで、文章全体の趣旨を踏まえて、1から5の中に入る最もよいものを、1・2・3・4から一つ選びなさい。',
  passage:[
   `私たちは何のために趣味を持つのだろうか。ある人は、仕事に${R('行','い')}き${R('詰','づ')}まったときに、${R('一心不乱','いっしんふらん')}に好きなことに${R('打','う')}ち${R('込','こ')}むことで、{{1|【1】}}、気持ちを前向きに切り替えることができるという。一つのことに集中することで、後ろ向きだった気持ちがリセットされるのだ。またある人は、仕事以外の仲間との付き合いもまた気分転換の一つだと考える。立場も年齢も異なる相手とのたわいもないおしゃべりがなかなか{{2|【2】}}。`,
   `このように聞くといいことずくめの趣味だが、心に留めておきたい点がある。まずは、新しいことを始める時の${R('高揚','こうよう')}した気分のまま、勢いでお金を使わないことだ。例えばスポーツの場合、道具や専用のウェア、施設使用料など、いろいろな費用がかかる。気をつけないと、特に${R('入門者','にゅうもんしゃ')}は、お金をどんどん${R('無駄','むだ')}に使うことにもなる。{{3|【3‑a】}}、気軽に始められそうなウォーキングでさえ、${R('意気込','いきご')}んで高いシューズを買ったものの、数回履いただけでその後はたんすの${R('肥','こ')}やし(注1)になる、というのは{{3|【3‑b】}}。新たに趣味を始める場合、初めから一気に投資するのではなく、少ない出費でも楽しめる方法をまず見つけ、徐々にレベルアップをしていくのが${R('賢明','けんめい')}なのだ。`,
   `もう一点は、はなから完璧を求めようとしないことだ。テレビでマラソン観戦をして、いざ自分も挑戦しようと思った場合、最初から長い距離に{{4|【4】}}。途中で足が${R('痙攣','けいれん')}(注2)してしまうかもしれないし、暑い夏なら${R('脱水症状','だっすいしょうじょう')}に${R('陥','おちい')}る危険性だってある。そんな事態を避けるためには、短時間のジョギングから体を${R('順応','じゅんのう')}させていくのがよい。まずは周りの景色を楽しめるぐらいのペースから行い、身体が慣れるのに合わせて、徐々に距離を伸ばしていくのだ。`,
   `ともあれ、趣味になり得るかどうかは、それを心地よい気持ちでやっているかどうかによるのであり、無理に趣味を持とうと{{5|【5】}}のはいうまでもない。`
  ],
  passageNote:'(注1) たんすの肥やし：使わずに、ずっとたんすにしまってある物　／　(注2) 痙攣：筋肉がひとりでに伸びたり縮んだりして、震えるようになる',
  passageVi:[
   'Chúng ta có sở thích để làm gì nhỉ? Có người nói rằng khi bế tắc trong công việc, nhờ dốc hết tâm trí vào việc mình thích mà họ được giải thoát khỏi tâm trạng nặng nề và có thể chuyển sang tâm thế tích cực. Tập trung vào một việc thì tâm trạng tiêu cực được "đặt lại". Lại có người cho rằng giao du với bạn bè ngoài công việc cũng là một cách giải tỏa. Những câu chuyện phiếm vu vơ với người khác vị trí, khác tuổi thì khá là thú vị.',
   'Nghe vậy thì sở thích toàn điều tốt, nhưng có những điểm cần ghi nhớ. Trước hết là đừng bốc đồng tiêu tiền theo tâm trạng hưng phấn khi bắt đầu việc mới. Ví dụ với thể thao thì tốn nhiều khoản như dụng cụ, trang phục chuyên dụng, phí sử dụng cơ sở. Nếu không cẩn thận, nhất là người mới, sẽ tiêu tiền lãng phí liên tục. Thoạt nhìn, ngay cả môn đi bộ tưởng chừng dễ bắt đầu, nhiều người hăm hở mua đôi giày đắt tiền nhưng mới đi vài lần rồi cất vào tủ luôn (注1), chuyện này thật thường gặp. Khi bắt đầu một sở thích mới, thay vì đầu tư một lần ngay từ đầu, khôn ngoan hơn là tìm cách vui với chi phí nhỏ trước rồi nâng dần trình độ.',
   'Điểm nữa là đừng đòi hỏi hoàn hảo ngay từ đầu. Xem marathon trên tivi rồi muốn tự mình thử, thì không cần thử thách ngay quãng đường dài. Có thể bị chuột rút (注2) giữa đường, mùa hè nóng còn có nguy cơ mất nước. Để tránh tình huống đó, nên cho cơ thể thích nghi dần từ việc chạy bộ ngắn. Trước hết chạy với tốc độ vừa đủ để ngắm cảnh xung quanh, rồi kéo dài dần quãng đường theo mức cơ thể quen.',
   'Dù sao thì một việc có thành sở thích hay không tùy thuộc vào việc mình làm nó với tâm trạng dễ chịu hay không, và việc không cần gồng mình hăm hở để cố có một sở thích là điều không cần nói.'
  ],
  passageNoteVi:'(Chú thích 1) たんすの肥やし: đồ không dùng, cất trong tủ mãi. (Chú thích 2) 痙攣: cơ tự co giãn và run lên.',
  qs:[
  {n:1, stem:'ある人は、仕事に行き詰まったときに、一心不乱に好きなことに打ち込むことで、【1】、気持ちを前向きに切り替えることができるという。',
   choices:['浮いた気持ちを沈め','沈んだ気持ちから解放され','落ち着いた気持ちをなくし','落ち込んだ気持ちを思い出し'], a:1,
   full:'…一心不乱に好きなことに打ち込むことで、<mark>沈んだ気持ちから解放され</mark>、気持ちを前向きに切り替えることができるという。',
   tr:'Có người nói rằng khi bế tắc trong công việc, nhờ dốc hết tâm trí vào việc mình thích mà họ được giải thoát khỏi tâm trạng chùng xuống và chuyển sang tâm thế tích cực.',
   vi:'Mạch văn: bế tắc trong công việc → say mê điều mình thích → <b>thoát khỏi tâm trạng nặng nề (沈んだ気持ちから解放され)</b> → chuyển sang hướng tích cực. Câu sau cũng nói "後ろ向きだった気持ちがリセットされる".<ul><li>Các đáp án khác (làm chìm tâm trạng phấn chấn, đánh mất sự bình tĩnh, nhớ lại tâm trạng buồn) đều đi ngược hướng "chuyển sang tích cực".</li></ul>'},
  {n:2, stem:'立場も年齢も異なる相手とのたわいもないおしゃべりがなかなか【2】。',
   choices:['いいというのだ','いいほどだ','いいためだ','いいことになる'], a:0,
   full:'立場も年齢も異なる相手とのたわいもないおしゃべりがなかなか<mark>いいというのだ</mark>。',
   tr:'(Người đó cho rằng) những câu chuyện phiếm vu vơ với người khác vị trí, khác tuổi thì khá là thú vị.',
   vi:'Đoạn này kể ý kiến của từng người ("ある人は… / またある人は…考える"), nên kết bằng <b>〜というのだ</b> = "(người ấy) cho rằng/nói rằng…" để truyền đạt lại ý kiến đó: なかなかいいというのだ.<ul><li>いいほどだ: "đến mức tốt", không tự nhiên.</li><li>いいためだ / いいことになる: sai lô-gic, không phải cách kết thúc phù hợp.</li></ul>'},
  {n:3, stem:'【3‑a】、気軽に始められそうなウォーキングでさえ、意気込んで高いシューズを買ったものの、数回履いただけでその後はたんすの肥やしになる、というのは【3‑b】。',
   choices:['a その結果／b あるわけでもない話だ','a といっても／b あることは間違いない話だ','a たしかに／b あるものでもない話だ','a 一見／b ありがちな話だ'], a:3, fixed:true,
   full:'<mark>一見</mark>、気軽に始められそうなウォーキングでさえ、…たんすの肥やしになる、というのは<mark>ありがちな話だ</mark>。',
   tr:'Thoạt nhìn, ngay cả môn đi bộ tưởng chừng dễ bắt đầu, nhiều người hăm hở mua đôi giày đắt tiền nhưng mới đi vài lần rồi cất vào tủ luôn, chuyện này thật thường gặp.',
   vi:'<b>a: 一見</b> = "thoạt nhìn" (đi bộ trông có vẻ dễ, ít tốn kém), và <b>b: ありがちな話だ</b> = "chuyện thường hay gặp". Cả câu: bề ngoài có vẻ không tốn kém nhưng mua đồ đắt rồi bỏ xó là chuyện hay xảy ra.<ul><li>その結果 / あるわけでもない: "kết quả là" không có quan hệ nhân quả với câu trước; "chuyện không hề có" phủ định ngược nội dung.</li><li>といっても / あることは間違いない: "tuy nói vậy" không hợp mạch.</li><li>たしかに / あるものでもない: "đúng là" rồi lại "không có chuyện đó", mâu thuẫn.</li></ul>'},
  {n:4, stem:'テレビでマラソン観戦をして、いざ自分も挑戦しようと思った場合、最初から長い距離に【4】。',
   choices:['チャレンジこそすべきだ','チャレンジするだけのことだ','チャレンジしてほしいのだ','チャレンジすることはない'], a:3,
   full:'…いざ自分も挑戦しようと思った場合、最初から長い距離に<mark>チャレンジすることはない</mark>。',
   tr:'Xem marathon trên tivi rồi muốn tự mình thử thì cũng không cần thử thách ngay quãng đường dài từ đầu.',
   vi:'Đoạn này khuyên <b>đừng đòi hỏi hoàn hảo ngay từ đầu</b>; đi quãng dài ngay có nguy cơ chuột rút, mất nước → <b>チャレンジすることはない</b> ("không cần phải thử thách"). <b>〜ことはない</b> = "không cần/không việc gì phải…".<ul><li>Ba đáp án còn lại khuyến khích thử thách ngay, ngược hẳn với ý tác giả.</li></ul>'},
  {n:5, stem:'ともあれ、趣味になり得るかどうかは、それを心地よい気持ちでやっているかどうかによるのであり、無理に趣味を持とうと【5】のはいうまでもない。',
   choices:['意気込む必要がある','意識しない必要などない','意識する必要がある','意気込む必要などない'], a:3,
   full:'…無理に趣味を持とうと<mark>意気込む必要などない</mark>のはいうまでもない。',
   tr:'Việc không cần phải gồng mình hăm hở để cố có một sở thích là điều không cần nói.',
   vi:'Câu trước: có thành sở thích hay không là do <b>làm với tâm trạng dễ chịu hay không</b> → vì vậy <b>無理に趣味を持とうと意気込む必要などない</b> = không cần gồng mình hăm hở để có sở thích. <b>〜必要などない</b> = "chẳng cần thiết phải…".<ul><li>意気込む必要がある / 意識する必要がある: ngược với ý "đừng ép bản thân".</li><li>意識しない必要などない: lặp phủ định, nghĩa ngược ("không có chuyện không cần ý thức").</li></ul>'}
  ]},

 /* ---------- 問題4 ---------- */
 {id:'b3s4', jp:'問題4', name:'Đọc hiểu (đoạn A–D)', type:'mc', reading:true,
  hint:'Đọc bốn đoạn A–D rồi trả lời các câu hỏi bên dưới (có ba chỗ trống 【A】【B】【C】 trong bài).',
  hintJp:'次の文章を読んで、後の問いに対する答えとして最もよいものを、1・2・3・4から一つ選びなさい。',
  passage:[
   `<span class="plab">A</span>インターネットが繋がらない部屋で${R('待機','たいき')}している人々の様子を見たことがある。全員が部屋に通される{{1|（Ａ）}}イラつき始めたが、間もなく${R('隣人','りんじん')}に話しかける人が出始めて会話が${R('弾','はず')}むようになった。インターネットが通じていたら彼らはデジタル機器に触れていて、そこにいる誰とも関係を持たなかっただろうに、切断されたおかげで新しい関係が生まれた。インターネットは人と人を結びつけるものであるが反対の状況を作る恐れもある。最近レストランにいる人を見る{{2|（Ｂ）}}見ていて、一緒にいるのにお互いに会話もせずおのおの違う画面に夢中になっていることに気がつき不安にかられた。`,
   `<span class="plab">B</span>ネット${R('依存','いぞん')}が深刻だそうだ。日本に${R('依存症','いぞんしょう')}とされる人が270万人もいるという話も、10~30代の30%以上が依存症だという話もある。依存症とは自分の意志でインターネットや携帯を止めることができず、ネットなしには一時もいられない状態になることだ。接続時間が長時間になると日常の生活にも${R('支障','ししょう')}が出る。自分が何をしているのかも分からなくなり、最悪の場合は${R('幻聴','げんちょう')}や${R('幻覚','げんかく')}に悩まされることさえあるそうだ。`,
   `<span class="plab">C</span>ITは便利な技術で生活の向上に役立ち、それを使って時間が短縮できるはずなのに、依存症の人にとっては反対に時間を奪う物に変わっている${R('始末','しまつ')}だ。便利なはずが絶えず誰かと繋がっていないと不安にかられ疲れが溜まる。それを断つために重症者は一瞬{{3|（Ｃ）}}機器に触れさせないように${R('隔離','かくり')}入院させられることもある。IT機器は手段に過ぎず適切に使うことで生活を快適にできるものを、機器に${R('振','ふ')}り${R('回','まわ')}されるとは${R('本末転倒','ほんまつてんとう')}である。`,
   `<span class="plab">D</span><u>①こんな状況下</u>ではITに不安を感じる人が出現するのは自然である。そこで「IT${R('断食','だんじき')}」つまりパソコンやスマートフォンなどのデジタル機器からの一時的隔離の必要性を主張する人が出てきた。あるIT企業はIT企業とはいえこれを始めた。この会社の場合は全面的に禁止しているのではないが、よく使われる念のために送るCCメールや、社内向け資料作成時のパワーポイントの使用を禁止した。又、会議でパソコンは使用禁止だそうだ。その結果、社員が相手の意見をしっかり聞くようになり仕事の質が高まったと言う。あるホテルはこれをビジネスに結びつけようとばかりに、脱デジタル滞在プランを売り出した。客は2泊3日インターネットを${R('遮断','しゃだん')}して実際に体を使って様々なことをこなしていく。値段は高いがリフレッシュできると希望者が絶えないそうだ。過度の情報社会に疲れた人が<u>②脱デジタルを楽しむ時代</u>が来ているようだ。`
  ],
  passageLabels:['A','B','C','D'],
  passageVi:[
   'Tôi từng thấy cảnh những người đang chờ trong một căn phòng không có kết nối internet. Vừa được đưa vào phòng, tất cả đều bắt đầu bực bội, nhưng chẳng bao lâu sau, bắt đầu có người bắt chuyện với người bên cạnh và câu chuyện trở nên rôm rả. Nếu có internet thì họ đã mải mê với thiết bị số và không có quan hệ gì với bất kỳ ai ở đó; nhờ bị ngắt kết nối mà những mối quan hệ mới đã nảy sinh. Internet là thứ kết nối con người với nhau, nhưng cũng có nguy cơ tạo ra tình huống ngược lại. Gần đây, khi tôi vô thức nhìn những người trong nhà hàng, tôi nhận ra dù ở cùng nhau mà họ chẳng trò chuyện gì, mỗi người mải mê một màn hình khác nhau, và tôi cảm thấy bất an.',
   'Nghe nói tình trạng nghiện mạng đang nghiêm trọng. Có chuyện rằng ở Nhật có tới 2,7 triệu người được coi là nghiện, cũng có chuyện rằng hơn 30% người ở độ tuổi 10–30 bị nghiện. Nghiện là tình trạng không thể tự ý chí dừng việc dùng internet hay điện thoại, không thể sống thiếu mạng dù chỉ một lúc. Nếu thời gian kết nối kéo dài thì sinh hoạt hằng ngày cũng bị ảnh hưởng. Đến mức không biết mình đang làm gì, và trong trường hợp xấu nhất, nghe nói thậm chí còn bị ảo thanh, ảo giác hành hạ.',
   'IT là công nghệ tiện lợi, giúp nâng cao đời sống, lẽ ra dùng nó thì rút ngắn được thời gian, vậy mà với người nghiện, nó lại biến thành thứ cướp mất thời gian. Lẽ ra phải tiện lợi nhưng lại bất an nếu không liên tục kết nối với ai đó, và mệt mỏi chồng chất. Để cắt đứt điều đó, người bệnh nặng có khi bị cho nhập viện cách ly để không được chạm vào thiết bị dù chỉ một khoảnh khắc. Thiết bị IT chỉ là phương tiện, nếu dùng đúng cách thì có thể làm cuộc sống dễ chịu hơn, vậy mà lại bị thiết bị xoay như chong chóng thì đúng là đảo lộn gốc ngọn (本末転倒).',
   'Trong tình trạng này (①), việc xuất hiện những người cảm thấy bất an với IT là điều tự nhiên. Vì thế, có người chủ trương sự cần thiết của "nhịn IT" (IT断食), tức là tạm thời cách ly khỏi các thiết bị số như máy tính, điện thoại thông minh. Có một công ty IT, dù là công ty IT, vẫn bắt đầu làm việc này. Công ty này không cấm hoàn toàn, nhưng cấm dùng CC email hay gửi để "cho chắc", cấm dùng PowerPoint khi làm tài liệu nội bộ. Nghe nói trong họp cũng cấm dùng máy tính. Kết quả là nhân viên chịu khó lắng nghe ý kiến người khác và chất lượng công việc tăng lên. Có một khách sạn còn gắn điều này với kinh doanh, tung ra gói lưu trú "thoát số". Khách ngắt internet 2 đêm 3 ngày, dùng cơ thể thực hiện nhiều việc thực tế. Giá cao nhưng nghe nói người muốn tham gia không dứt vì có thể làm mới bản thân. Có vẻ như thời đại mà những người mệt mỏi với xã hội thông tin quá mức vui hưởng việc "thoát số" (②) đang đến.'
  ],
  qs:[
  {n:1, text:'（Ａ）の中に最もよいものを入れなさい。',
   choices:['ときたら','が最後','やいなや','や早いが'], a:2,
   full:'全員が部屋に通される<mark>やいなや</mark>イラつき始めたが、間もなく隣人に話しかける人が出始めて会話が弾むようになった。',
   tr:'Vừa được đưa vào phòng, tất cả đã bắt đầu bực bội, nhưng chẳng bao lâu sau bắt đầu có người bắt chuyện với người bên cạnh và câu chuyện trở nên rôm rả.',
   vi:'<b>〜やいなや</b> = "vừa… là ngay lập tức…". 全員が部屋に通されるやいなや、イラつき始めた = vừa được đưa vào phòng là bắt đầu bực bội.<ul><li>ときたら: "nói đến… thì" (phàn nàn).</li><li>が最後: "một khi đã… thì (chắc chắn kết quả xấu)", đi với thể た (通されたが最後).</li><li>や早いが: không có mẫu này (đúng là や否や hoặc が早いか).</li></ul>'},
  {n:2, text:'（Ｂ）の中に最もよいものを入れなさい。',
   choices:['とあれば','ともなく','ともすれば','ともあれば'], a:1,
   full:'最近レストランにいる人を見る<mark>ともなく</mark>見ていて、一緒にいるのにお互いに会話もせずおのおの違う画面に夢中になっていることに気がつき不安にかられた。',
   tr:'Gần đây, khi tôi vô thức nhìn những người trong nhà hàng, tôi nhận ra dù ở cùng nhau mà họ chẳng trò chuyện, mỗi người mải mê một màn hình khác nhau, và tôi thấy bất an.',
   vi:'<b>〜ともなく</b> (V thể từ điển + ともなく + V) = "vô thức, không có chủ ý (làm gì)": 見るともなく見ていて = "nhìn mà không hẳn chủ ý nhìn", tình cờ để mắt tới.<ul><li>とあれば: "nếu là… / nếu cần thì…".</li><li>ともすれば: "dễ có xu hướng…" (ともすれば〜がちだ).</li><li>ともあれば: không phải cách nói phù hợp.</li></ul>'},
  {n:3, text:'（Ｃ）の中に最もよいものを入れなさい。',
   choices:['のだに','ならば','だったら','たりとも'], a:3,
   full:'それを断つために重症者は一瞬<mark>たりとも</mark>機器に触れさせないように隔離入院させられることもある。',
   tr:'Để cắt đứt điều đó, người bệnh nặng có khi bị cho nhập viện cách ly để không được chạm vào thiết bị dù chỉ một khoảnh khắc.',
   vi:'<b>〜たりとも〜ない</b> = "dù chỉ… (một khoảnh khắc/một đồng) cũng không…" (nhấn mạnh đơn vị nhỏ nhất, đi với 一 + đơn vị). 一瞬たりとも機器に触れさせない = không cho chạm vào thiết bị dù chỉ một khoảnh khắc.<ul><li>のだに: dạng cổ, không dùng ở đây.</li><li>ならば / だったら: "nếu là…", không hợp nghĩa.</li></ul>'},
  {n:4, text:'<u>①こんな状況下</u>とはどんな状況か。当てはまらないのはどれか。',
   choices:['ネットなしではいられない状況','幻聴や幻覚が出てくるような状況','便利なのでよく利用する状況','ITに振り回される状況'], a:2,
   vi:'Câu hỏi yêu cầu chọn đáp án <b>KHÔNG</b> phù hợp. "Tình trạng này" chỉ nội dung ở đoạn B và C: không thể sống thiếu mạng, xuất hiện ảo thanh ảo giác, bị IT xoay như chong chóng.<br>Còn <b>"vì tiện nên hay dùng"</b> chỉ là cách dùng bình thường, không phải tình trạng đáng lo nên đây là đáp án đúng của câu hỏi.'},
  {n:5, text:'<u>②脱デジタルを楽しむ時代</u>とはどんな時代になることか。',
   choices:['ネット依存を脱デジタルで治療する時代','情報社会に疲れた人が増加する時代','脱デジタル生活がビジネスになる時代','実際の体験をしたい人が増えていく時代'], a:3,
   vi:'Đoạn D: khách sạn tổ chức gói lưu trú "thoát số" 2 đêm 3 ngày, ngắt internet và <b>dùng cơ thể thực hiện nhiều việc thực tế</b>; người muốn tham gia không dứt. Vì vậy "thời đại vui hưởng thoát số" là thời đại có ngày càng nhiều người muốn có <b>trải nghiệm thực tế</b>.<ul><li>Đáp án 1: bài không nói đến việc "chữa trị".</li><li>Đáp án 2: người mệt mỏi vì xã hội thông tin là bối cảnh, chưa phải nội dung của "thời đại ②".</li><li>Đáp án 3: gói của khách sạn chỉ là một ví dụ, không phải đặc trưng của cả thời đại.</li></ul>'},
  {n:6, text:'Ａ～Ｄのそれぞれの段落の概要で正しいのはどれか。',
   choices:['A:インターネットは人と人を引き離してしまうものだ。','B:インターネット利用者の30%が依存症になっている。','C:手段に過ぎないインターネットに混乱させられている。','D:全てのインターネット利用者にIT断食が必要である。'], a:2,
   vi:'Đoạn C nói IT chỉ là phương tiện mà lại bị nó xoay như chong chóng (本末転倒) → <b>C: bị Internet, vốn chỉ là phương tiện, làm cho rối loạn</b>.<ul><li>A: bài nói Internet vừa kết nối con người vừa có thể tạo tình huống ngược lại, không khẳng định "chỉ chia rẽ".</li><li>B: chỉ là "có chuyện rằng" hơn 30% ở lứa tuổi 10–30, không phải 30% mọi người dùng.</li><li>D: chỉ có người chủ trương cần "nhịn IT", không phải mọi người dùng đều cần.</li></ul>'},
  {n:7, text:'作者のインターネットに対する考えはどれか。',
   choices:['ネットは上手に使って生活の役に立てるのがよい。','ネット依存症を根本的に治す方法はないに違いない。','ITを完全に遮断したほうがビジネスはうまくいく。','ITの使用を止めて実際に会って話すことが大切だ。'], a:0,
   vi:'Tác giả viết "IT機器は手段に過ぎず適切に使うことで生活を快適にできる" → <b>nên dùng khéo để phục vụ cuộc sống</b>.<ul><li>Đáp án 2: bài không khẳng định là không có cách chữa.</li><li>Đáp án 3: công ty chỉ hạn chế một phần, không "ngắt hoàn toàn".</li><li>Đáp án 4: tác giả không chủ trương ngừng dùng hẳn.</li></ul>'}
  ]}
 ]

/* ===== BỘ ĐỀ 4 · 第１ ===== */
{
 id:'k41', no:4, tag:'Bộ đề 4', title:'第１',
 sub:'〜を皮切りに ・ 〜に至るまで ・ 〜を限りに ・ 〜をもって ・ 〜といったところ',
 group:'Bộ đề 4 · Ngữ pháp theo chủ điểm',
 sections:[
 MC('k41a','問題１','〜を皮切りに',GN.kawakiri,[
  Q(1,'その宇宙飛行士の講演会は（　　）を皮切りに、130か所で行われた。',['北海道','外国','全国'],'a',
   'Buổi diễn thuyết của phi hành gia ấy bắt đầu từ Hokkaido rồi được tổ chức tại 130 nơi.',
   '<b>〜を皮切りに</b> đi sau <b>điểm xuất phát cụ thể</b> (một địa danh/sự kiện đầu tiên). 北海道 là nơi bắt đầu, sau đó mở rộng ra 130 nơi.<ul><li><b>外国</b>: không phải một điểm bắt đầu cụ thể.</li><li><b>全国</b>: là phạm vi chung, không thể làm "điểm khởi đầu".</li></ul>'),
  Q(2,'この選手は昨年の地区大会入賞を皮切りに、（　　）。',['ますます練習に励んでいる','今年も入賞が期待される','いくつもの大会で好成績を残している'],'c',
   'Vận động viên này bắt đầu từ giải nhất khu vực năm ngoái, rồi đạt thành tích tốt ở rất nhiều giải đấu.',
   'Vế sau của 〜を皮切りに phải là <b>chuỗi sự việc nối tiếp, mở rộng</b>: いくつもの大会で好成績を残している.<ul><li><b>ますます練習に励んでいる</b>: là một việc liên tục chứ không phải chuỗi sự kiện kế tiếp nhau.</li><li><b>今年も入賞が期待される</b>: chỉ một sự việc, mang tính dự đoán.</li></ul>'),
  Q(3,'山田さんの発言を皮切りにして、（　　）。',['皆さんが意見を言ってください','みんなが次々に意見を言った','川田さんも意見を言った'],'b',
   'Bắt đầu từ phát biểu của anh Yamada, mọi người lần lượt nêu ý kiến.',
   '<b>次々に</b> = lần lượt, nối tiếp, hợp với 〜を皮切りに. Vế sau là sự việc đã xảy ra (thể quá khứ) chứ không phải mệnh lệnh.<ul><li><b>皆さんが意見を言ってください</b>: mệnh lệnh/nhờ vả, không dùng với 〜を皮切りに.</li><li><b>川田さんも意見を言った</b>: chỉ thêm một người, không phải chuỗi mở rộng.</li></ul>'),
  Q(4,'中川さんは10年前の個展を皮切りとして、（　　）。',['いろいろなところで個展を開いている','その後2度個展を開いた','1度も個展を開いていない'],'a',
   'Chị Nakagawa bắt đầu từ buổi triển lãm cá nhân cách đây 10 năm, và hiện đang mở triển lãm ở nhiều nơi.',
   'Cần vế sau thể hiện <b>sự mở rộng liên tục</b>: いろいろなところで. <ul><li><b>その後2度</b>: con số nhỏ cụ thể, không phải mở rộng.</li><li><b>1度も開いていない</b>: mâu thuẫn, vì đã bắt đầu từ một buổi triển lãm.</li></ul>'),
  Q(5,'わたしは退職の記念旅行を皮切りとして、（　　）。',['旅行が老後の趣味になった','国内、国外をあちこち旅行している','旅行会社に勤め始めた'],'b',
   'Tôi bắt đầu từ chuyến du lịch kỷ niệm nghỉ hưu, rồi đi du lịch khắp nơi trong và ngoài nước.',
   'Vế sau phải nói <b>nhiều chuyến đi nối tiếp</b>: 国内、国外をあちこち旅行している.<ul><li><b>旅行が老後の趣味になった</b>: chỉ là sự thay đổi sở thích, không có chuỗi sự việc.</li><li><b>旅行会社に勤め始めた</b>: một việc đơn lẻ, không liên quan mạch chuyện.</li></ul>')
 ]),
 MC('k41b','問題２','〜に至るまで',GN.itaru,[
  Q(1,'小林先生には卒業後の進路はもちろん、（　　）に至るまで何でも相談している。',['勉強','宿題のやり方','恋愛の悩み'],'c',
   'Tôi nhờ thầy Kobayashi tư vấn mọi thứ, từ hướng đi sau tốt nghiệp cho đến cả chuyện phiền muộn tình yêu.',
   '〜に至るまで nhấn mạnh <b>cả những chuyện tận cùng/ngoài dự đoán</b>. Hướng đi sau tốt nghiệp là chuyện đương nhiên, còn 恋愛の悩み là chuyện cá nhân nhất nên hợp với "đến cả".<ul><li><b>勉強, 宿題のやり方</b>: là chuyện quá bình thường khi nhờ thầy giáo, không có sắc thái "đến cả".</li></ul>'),
  Q(2,'外国で暮らすことになったので、（　　）に至るまでみんなリサイクルショップに売った。',['ベッドからスプーン','皿からカップ','雑誌から本'],'a',
   'Vì sắp sống ở nước ngoài nên tôi bán hết mọi thứ cho cửa hàng đồ cũ, từ cái giường cho đến cái thìa.',
   '<b>AからBに至るまで</b>: A và B là hai đầu của một phạm vi (<b>lớn ↔ nhỏ</b>), nên ベッド (đồ lớn) ↔ スプーン (đồ nhỏ) là cặp đối cực.<ul><li><b>皿からカップ, 雑誌から本</b>: cùng cỡ/cùng loại, không tạo thành hai đầu của phạm vi.</li></ul>'),
  Q(3,'ゆみさんは天気はもちろん、（　　）に至るまで日記に書き留めているそうだ。',['その日の自分の行動','その日の朝、昼、晩の気温','その日の出来事'],'b',
   'Nghe nói Yumi ghi vào nhật ký không chỉ thời tiết mà cả nhiệt độ buổi sáng, trưa, tối của ngày hôm đó.',
    'Sau 〜はもちろん là <b>chi tiết nhỏ hơn, tỉ mỉ hơn</b>. 天気 → 朝昼晩の気温 là sự cụ thể hóa tận cùng.<ul><li><b>自分の行動, 出来事</b>: là nội dung nhật ký thông thường, không phải mức "đến tận chi tiết nhỏ".</li></ul>')
 ]),
 MC('k41c','問題３','〜を限りに',GN.kagiri,[
  Q(1,'この店は（　　）を限りに閉店するそうだ。',['今月','今月まで','あと一月'],'a',
   'Nghe nói cửa hàng này sẽ đóng cửa vào cuối tháng này.',
   '<b>〜を限りに</b> đi sau <b>danh từ thời điểm</b>: 今月を限りに.<ul><li><b>今月まで</b>: đã có まで rồi nên không thể thêm を限りに.</li><li><b>あと一月</b>: là khoảng thời gian, không phải mốc thời điểm.</li></ul>'),
  Q(2,'わたしは今日を限りに（　　）。',['この会社の社員です','この会社を辞めます','新しい会社に入社します'],'b',
   'Tôi sẽ nghỉ việc ở công ty này kể từ hôm nay.',
   'Vế sau của 〜を限りに là <b>việc chấm dứt</b>: 辞めます.<ul><li>Hai đáp án còn lại diễn tả trạng thái đang tiếp diễn hoặc một sự bắt đầu mới.</li></ul>'),
  Q(3,'この高校は今年を限りに（　　）ことになっている。',['開校される','生徒数が増加する','生徒を募集しない'],'c',
   'Trường cấp ba này đã quyết định từ năm nay sẽ không tuyển sinh nữa.',
   '〜を限りに + <b>kết thúc</b>: 生徒を募集しない (ngừng tuyển sinh).<ul><li><b>開校される, 生徒数が増加する</b>: là sự bắt đầu/tăng lên, trái nghĩa với ý chấm dứt.</li></ul>')
 ]),
 MC('k41d','問題４','〜をもって',GN.motte,[

  {n:3, board:0, text:'ひも・縄・帯・包み・荷物', a:3, vi:'<b>ひもを解く</b> = cởi, tháo (dây, gói). 解く ở đây có nghĩa "tháo ra cái đã buộc/gói".'},
  {n:4, board:0, text:'ハンドル・マイク・ペン・包丁・手', a:2, vi:'<b>ハンドルを握る</b> = cầm lấy, nắm chặt (vô lăng, micro, bút, dao, tay). 握る (にぎる) = nắm.'},

  {n:7, board:1, text:'道路・入り口・穴・血管', a:4, vi:'<b>道路／入り口／穴／血管がふさがる</b> = đường, lối vào, lỗ, mạch máu bị chặn, bị tắc.'},
  {n:8, board:1, text:'なぞ・問題・パズル・疑問', a:0, vi:'<b>なぞ／問題／パズル／疑問を解く</b> = giải (câu đố, bài toán, thắc mắc).'},

  {n:10, board:1, text:'誤解・事故・混乱・疑い', a:2, vi:'<b>誤解／事故／混乱／疑いを招く</b> = dẫn đến (hậu quả không hay): gây hiểu lầm, gây tai nạn, gây hỗn loạn, bị nghi ngờ.'},
  {n:11, board:1, text:'関心・信頼・期待・思い・好意', a:1, vi:'<b>関心／信頼／期待／思い／好意を寄せる</b> = dành sự quan tâm, tin tưởng, kỳ vọng, tình cảm cho ai đó.'},
  {n:12, board:1, text:'特徴・状況・変化・意味', a:3, vi:'<b>特徴／状況／変化／意味をとらえる</b> = nắm bắt (đặc điểm, tình hình, sự thay đổi, ý nghĩa).'},
  {n:13, board:2, text:'財布・かぎ・権力', a:3, vi:'<b>財布／かぎ／権力を握る</b> = nắm giữ (ví tiền, chìa khóa, quyền lực). Nghĩa bóng: nắm quyền kiểm soát.'},
  {n:14, board:2, text:'渋滞・わな・深み', a:0, vi:'<b>渋滞／わな／深みにはまる</b> = sa vào, mắc vào (kẹt xe, bẫy, chỗ nước sâu). Đi với <b>に</b>.'},
  {n:15, board:2, text:'誤解・緊張・怒り', a:2, vi:'<b>誤解／緊張／怒りを解く</b> = hóa giải, xóa bỏ (hiểu lầm, căng thẳng, cơn giận).'},
  {n:16, board:2, text:'赤字・借金・予算', a:4, vi:'<b>赤字／借金／予算が膨らむ</b> = thâm hụt, nợ, ngân sách phình to ra.'},
  {n:17, board:2, text:'席・部屋・電話・予定・手', a:5, vi:'<b>席／部屋／電話／予定／手がふさがる</b> = chỗ ngồi, phòng, điện thoại đã có người dùng/kín lịch/bận tay (không rảnh).'},
  {n:18, board:2, text:'苦情・要望・相談・感想・意見・質問', a:1, vi:'<b>苦情／要望／相談／感想／意見／質問を寄せる</b> = gửi đến (khiếu nại, yêu cầu, tư vấn, cảm tưởng, ý kiến, câu hỏi). Thường dùng 〜が寄せられる.'}
